<script>
'use strict';

const SUPER_ADMIN_TG_ID = '1362467716'; 

const API_CONFIG = { baseUrl: 'https://ichiflow-worker.ichiflow.workers.dev', projectKey: 'film-rengasdengklok', timeout: 15000, enabled: true };

const Session = {
  user: null, profile: null, membership: null, memberships: [], projects: [], tiers: [],
  activeProjectKey: 'film-rengasdengklok', isUnlocked: false, lastActivity: Date.now(), idleTimeout: 15 * 60 * 1000, page: 'init',
};

function getInitData() { try { if (window.Telegram?.WebApp?.initData && window.Telegram.WebApp.initData.length > 0) return window.Telegram.WebApp.initData; } catch (e) {} return null; }
function isInTelegram() { return !!getInitData(); }

async function apiFetch(path, options = {}) {
  if (!API_CONFIG.enabled) throw new Error('API dinonaktifkan');
  const initData = getInitData();
  if (!initData) throw new Error('initData Telegram tidak tersedia.');
  const url = API_CONFIG.baseUrl + path;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), API_CONFIG.timeout);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal, headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, ...(options.headers || {}) } });
    clearTimeout(timeoutId);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  } catch (e) { clearTimeout(timeoutId); if (e.name === 'AbortError') throw new Error('Request timeout'); throw e; }
}

const API = {
  async getMe() { return await apiFetch('/api/me'); },
  async getState() { return await apiFetch('/api/state'); },
  async saveState(state) { return await apiFetch('/api/state', { method: 'PUT', body: JSON.stringify({ state }) }); },
  async getSyncLog() { return await apiFetch('/api/sync-log'); },
  async getMemberships() { return await apiFetch('/api/memberships'); },
  async getProjects() { return await apiFetch('/api/projects'); },
  async register(data) { return await apiFetch('/api/register', { method: 'POST', body: JSON.stringify(data) }); },
  async verifyPin(pin, info = {}) { return await apiFetch('/api/verify-pin', { method: 'POST', body: JSON.stringify({ pin, name: info.name || '', role: info.role || '', roleCode: info.roleCode || '' }) }); },
  async getRecords(since) { return await apiFetch('/api/records?since=' + encodeURIComponent(since || 0)); },
  async syncRecords(ops) { return await apiFetch('/api/records/sync', { method: 'POST', body: JSON.stringify({ ops }) }); },
  async resetRecords() { return await apiFetch('/api/records/reset', { method: 'POST', body: '{}' }); },
  async getTiers() { return await apiFetch('/api/tiers'); },
  async addTier(data) { return await apiFetch('/api/tiers', { method: 'POST', body: JSON.stringify(data) }); },
  async deleteTier(id) { return await apiFetch('/api/tiers', { method: 'DELETE', body: JSON.stringify({ id }) }); }
};

const ConnectionStatus = {
  online: null, lastCheck: 0, lastError: null, listeners: [],
  async check() { if (!isInTelegram()) { this.online = false; this.lastError = 'Mode Lokal'; this.notify(); return false; } try { await API.getMe(); this.online = true; this.lastError = null; } catch (e) { this.online = false; this.lastError = e.message; } this.lastCheck = Date.now(); this.notify(); return this.online; },
  notify() { for (const fn of this.listeners) { try { fn(this.online, this.lastError); } catch {} } },
  subscribe(fn) { this.listeners.push(fn); }
};

const DEFAULT_DEPTS=['Client','Art Director','Production Assistant Art','Props','Art Grips','Preps Art','Grafis','MockUp','Builder','Vehicle','Scenic','Landscape'];
const DEPTS=DEFAULT_DEPTS.slice();
const LEGACY_ADMIN_ROLES=['Manager Finance','Direktur'];
const ADMIN_ROLES=['Admin','Art Director','Assistant Production','Finance Director','Manager Finance','Direktur'];
const ROLE_CODES={'Admin':'540213','Art Director':'888888','Assistant Production':'888888','Finance Director':'888888'};
const REGISTRABLE_ROLES=['Admin','Art Director','Assistant Production','Finance Director','Grafis','Scenic','Props','Builder','Landscape','MockUp','Vehicle'];
const ADMIN_CODE='000000';
const AKUN_COA_MAP={'Art Grips':'5200','Builder':'5210','Props':'5220','MockUp':'5230','Preps Art':'5240','Grafis':'5250','Vehicle':'5370','Scenic':'5240'};
const TIER1_PAYER_MAP={
  'Preps Art':['Production Assistant Art','Art Director'],
  'Meals':['Production Assistant Art','Art Director'],
  'Art Grip':['Production Assistant Art','Art Director'],
  'Art Grips':['Production Assistant Art','Art Director'],
  'Scenic':['Production Assistant Art','Art Director'],
  'Props':['Props'],'Hand Props':['Props'],'Key Props':['Props'],'Props Maker':['Props'],
  'Grafis':['Grafis'],'Mockup':['MockUp'],'MockUp':['MockUp'],
  'Builder':['Builder'],'Landscape':['Builder'],'Vehicle':['Vehicle']
};
function suggestPayer(rabItem){
  if(!rabItem||!rabItem.tier1_id)return 'Art Director';
  const t1=Session.tiers.find(t=>t.id===rabItem.tier1_id);
  if(!t1)return 'Art Director';
  const payers=TIER1_PAYER_MAP[t1.name];
  if(payers){for(const p of payers){if(DEPTS.includes(p))return p;}}
  return 'Art Director';
}
function syncDeptsFromStore(){
  if(Array.isArray(Store.state.customDepts)&&Store.state.customDepts.length){
    DEPTS.length=0;Store.state.customDepts.forEach(d=>DEPTS.push(d));
  }
}

let role='Manager Finance',page='Dashboard',filter='Semua', accountingTab='coa', hrTab='employees', arTab='payable', bankTab='upload';
let rabFilter={tier1:'',tier2:'',tier3:''};
function setRabFilter(level,val){rabFilter[level]=val;if(level==='tier1'){rabFilter.tier2='';rabFilter.tier3=''}if(level==='tier2'){rabFilter.tier3=''}render()}
function resetRabFilter(){rabFilter={tier1:'',tier2:'',tier3:''};render()}
function filterRabItems(items){
  return items.filter(it=>{
    if(filter !== 'Semua' && it.dept !== filter) return false;
    return (!rabFilter.tier1||it.tier1_id===rabFilter.tier1)&&(!rabFilter.tier2||it.tier2_id===rabFilter.tier2)&&(!rabFilter.tier3||it.tier3_id===rabFilter.tier3);

// Grafik batang dibuat sebagai gambar PNG, lalu ditempel ke Excel
function chartPNG(title,labels,series){
  const W=900,H=420,padL=90,padR=24,padT=64,padB=86;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,W,H);
  g.fillStyle='#173c32';g.font='bold 20px sans-serif';g.fillText(title,padL,36);
  const cw=W-padL-padR,ch=H-padT-padB;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>Number(v)||0)));
  g.font='12px sans-serif';g.strokeStyle='#dde3da';g.fillStyle='#718077';g.lineWidth=1;
  for(let i=0;i<=4;i++){const y=padT+ch-(ch*i)/4;g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();g.fillText(rpShort(max*i/4),8,y+4);}
  const gw=cw/Math.max(1,labels.length),bw=Math.min(56,(gw*0.72)/Math.max(1,series.length));
  labels.forEach((lab,li)=>{
    const gx=padL+li*gw+(gw-bw*series.length)/2;
    series.forEach((s,si)=>{
      const v=Math.max(0,Number(s.values[li])||0),bh=(ch*v)/max;
      g.fillStyle=s.color;g.fillRect(gx+si*bw,padT+ch-bh,bw-4,bh);
      if(v>0){const t=rpShort(v);g.fillStyle='#172d29';g.font='12px sans-serif';g.fillText(t,gx+si*bw+(bw-4)/2-g.measureText(t).width/2,padT+ch-bh-6);}
    });
    const full=String(lab),short=full.length>16?full.slice(0,15)+'…':full;
    g.fillStyle='#172d29';g.font='13px sans-serif';
    g.fillText(short,padL+li*gw+gw/2-g.measureText(short).width/2,padT+ch+22);
  });
  let lx=padL;
  series.forEach(s=>{g.fillStyle=s.color;g.fillRect(lx,H-34,14,14);g.fillStyle='#172d29';g.font='13px sans-serif';g.fillText(s.name,lx+20,H-22);lx+=g.measureText(s.name).width+54;});
  return cv.toDataURL('image/png');
}
function xlTitle(ws,title,sub,ncols){

function xlHeaderRow(ws,row,headers){

}
// Menulis tabel dengan header hijau, garis tipis, dan baris total tebal (boldIdx = nomor baris yang dicetak tebal)
function xlTable(ws,row,headers,rows,fmts,boldIdx){
  xlHeaderRow(ws,row,headers);
  rows.forEach((vals,ri)=>{
    const bold=!!boldIdx&&boldIdx.includes(ri);
    const rr=ws.getRow(row+1+ri);
    vals.forEach((v,ci)=>{
      const c=rr.getCell(ci+1);
      c.value=v===undefined?null:v;
      c.border=xlBorder();
      if(fmts&&fmts[ci])c.numFmt=fmts[ci];
      if(bold){c.font={bold:true};c.fill=xlFill(XLC.total);}
      else if(ri%2===1)c.fill=xlFill(XLC.light);
    });
  });
  return row+1+rows.length;
}

async function buildReportWorkbook(page){
  if(typeof ExcelJS==='undefined')throw new Error('Library Excel belum termuat. Coba lagi.');
  const wb=new ExcelJS.Workbook();
  wb.creator='IchiFlow';
  let ok=false;
  if(page==='Dashboard')ok=addDashboardSheets(wb);
  else if(page==='RAB Proyek')ok=addRabSheets(wb);

  return ok?wb:null;
}

const RecSync=(()=>{
  const COLLS=['accounts','requests','flows','expenses','journals','payables','receivables','fixedAssets','depreciationRuns','taxRecords','employees','payrolls','bankStatements','bankMatches','mail','rabArchives'];
  const META=['activeRabId','counters','customDepts','lastResetAt','project','version'];
  const ORDER={meta:0,rabArchives:1,rabItems:2};
  let known=new Map(), lastPull=0;
  const clean=o=>{const c={...o};delete c._by;return c;};
  function flatten(state){
    const m=new Map();
    COLLS.forEach(coll=>{
      (state[coll]||[]).forEach(el=>{
        if(!el||!el.id)return;
        const key=coll+':'+el.id, data=clean(el);
        const items=coll==='rabArchives'?(data.items||[]):null;
        if(items)delete data.items;
        m.set(key,{key,coll,parent:'',data});
        (items||[]).forEach(it=>{ if(it&&it.id)m.set('rabItems:'+it.id,{key:'rabItems:'+it.id,coll:'rabItems',parent:key,data:clean(it)}); });
      });
    });
    META.forEach(k=>{ if(state[k]!==undefined)m.set('meta:'+k,{key:'meta:'+k,coll:'meta',parent:'',data:{k,v:state[k]}}); });
    return m;
  }
  function diff(state){
    const cur=flatten(state), ops=[];
    cur.forEach((rec,key)=>{
      const json=JSON.stringify(rec.data), k=known.get(key);
      if(!k) ops.push({op:'upsert',key,coll:rec.coll,parent:rec.parent,data:rec.data,base:0,json});
      else if(k.json!==json||k.parent!==rec.parent) ops.push({op:'upsert',key,coll:rec.coll,parent:rec.parent,data:rec.data,base:k.v,json});
    });
    known.forEach((k,key)=>{ if(!cur.has(key)) ops.push({op:'delete',key,coll:k.coll,parent:'',base:k.v,json:''}); });
    return ops;
  }
  const withBy=r=>{const o={...r.data}; if(r.updatedBy)o._by={name:r.updatedBy,role:r.updatedRole||'',at:r.updatedAt||0}; return o;};
  function upsertLocal(s,r){
    if(r.coll==='meta'){ s[r.data.k]=r.data.v; return; }
    if(r.coll==='rabItems'){
      const aid=String(r.parent).split(':').slice(1).join(':');
      const arch=(s.rabArchives||[]).find(a=>a.id===aid); if(!arch)return;
      arch.items=arch.items||[];
      const i=arch.items.findIndex(x=>x.id===r.data.id), obj=withBy(r);
      if(i>=0)arch.items[i]=obj; else arch.items.push(obj);
      return;
    }
    const arr=s[r.coll]; if(!arr)return;
    const obj=withBy(r);
    if(r.coll==='rabArchives'){ const old=arr.find(a=>a.id===r.data.id); obj.items=old?.items||[]; }
    const i=arr.findIndex(x=>x.id===r.data.id);
    if(i>=0)arr[i]=obj; else arr.push(obj);
  }
  function removeLocal(s,key){
    const i=key.indexOf(':'), coll=key.slice(0,i), id=key.slice(i+1);
    if(coll==='meta')return;
    if(coll==='rabItems'){ (s.rabArchives||[]).forEach(a=>{ if(a.items)a.items=a.items.filter(x=>x.id!==id); }); return; }
    if(s[coll])s[coll]=s[coll].filter(x=>x.id!==id);
  }
  // Terapkan satu data dari server ke state lokal. force=true: pakai versi server apa pun yang terjadi.
  function apply(s,r,force){
    if(r.deleted){ removeLocal(s,r.key); known.delete(r.key); return true; }
    const k=known.get(r.key);
    if(!force && k && k.v===r.version) return false;
    upsertLocal(s,r);
    known.set(r.key,{v:r.version,json:JSON.stringify(r.data),parent:r.parent||'',coll:r.coll});
    return true;
  }
  const sortRecs=recs=>[...recs].sort((a,b)=>(ORDER[a.coll]||0)-(ORDER[b.coll]||0)||(a.created||0)-(b.created||0));
  function emptyState(){ const s={}; COLLS.forEach(c=>s[c]=[]); return s; }
  function pickState(state){ const s={}; COLLS.forEach(c=>s[c]=JSON.parse(JSON.stringify(state[c]||[]))); META.forEach(k=>{ if(state[k]!==undefined)s[k]=JSON.parse(JSON.stringify(state[k])); }); return s; }
  function buildInto(s,recs){ sortRecs(recs).forEach(r=>apply(s,r)); }
  return {
    flatten,diff,apply,buildInto,emptyState,pickState,sortRecs,
    markPushed(key,v,json,parent,coll){ known.set(key,{v,json,parent,coll}); },
    unmark(key){ known.delete(key); },
    drop(s,key){ removeLocal(s,key); },
    clearKnown(){ known=new Map(); },
    lastPull(){ return lastPull; },
    setLastPull(t){ lastPull=t; },
  };
})();

function postReturn(flow){const kasPusat=Accounting.accByCode('1100'),kasDept=Accounting.accByCode('1110');return Accounting.createJournal({date:flow.date,description:`Pengembalian dari ${flow.dept}: ${flow.ref}`,reference:flow.id,lines:[{accountId:kasPusat.id,debit:flow.amount,description:'Kas pusat masuk'},{accountId:kasDept.id,credit:flow.amount,description:`Kas ${flow.dept} kembali`}],idempotencyKey:'flow-'+flow.id});}
function postExpense(exp){ const lines=[]; const activeRab=Store.state.rabArchives.find(r=>r.id===Store.state.activeRabId); const rabItem=activeRab?.items.find(i=>i.id===exp.rabItemId); let debitAcc; if(rabItem&&rabItem.akunCoa){debitAcc=Accounting.accByCode(String(rabItem.akunCoa));} if(!debitAcc){const kindToCode={'Beban':'5100','Persediaan':'1300','Aset':'1400'};debitAcc=Accounting.accByCode(kindToCode[exp.kind]||'5100');} const creditAcc=Accounting.accByCode('1110'); if(!debitAcc||!creditAcc)throw new Error('Akun tidak ditemukan.'); const netAmount=exp.amount; lines.push({accountId:debitAcc.id,debit:exp.amount,description:exp.title}); lines.push({accountId:creditAcc.id,credit:netAmount,description:`Kas ${exp.dept}`}); return Accounting.createJournal({date:exp.date,description:`${exp.kind}: ${exp.title}${exp.vendor?' — '+exp.vendor:''}`,reference:exp.id,lines,idempotencyKey:'exp-'+exp.id}); }
function autoJournalizeAll(){ const s=Store.state; for(const f of s.flows){ if(s.journals.some(j=>j.idempotencyKey==='flow-'+f.id))continue; try{if(f.type==='income')postClientReceipt(f);else if(f.type==='allocation')postDepartmentAllocation(f);else if(f.type==='return')postReturn(f);}catch(e){console.warn('Auto-journal flow gagal',f.id,e.message);} } for(const e of s.expenses){ if(e.status!=='Diverifikasi')continue; if(s.journals.some(j=>j.idempotencyKey==='exp-'+e.id))continue; try{postExpense(e);}catch(err){console.warn('Auto-journal exp gagal',e.id,err.message);} } }
function save(action){ try{autoJournalizeAll();}catch(e){notice('Auto-jurnal: '+e.message);} Store.state.audit.unshift({time:new Date().toISOString(),actor:role,action}); try{Store.commit();}catch(e){notice(e.message);return;} render(); setTimeout(updateSyncIndicator, 100); }
function updateSyncIndicator(){ const el=document.getElementById('sync-indicator'); if(!el) return; const lastSync=Store.getLastSync(); if(!isInTelegram()){ el.textContent='● Mode lokal'; el.style.color='#886211'; } else if(!Store.isRemoteLoaded()){ el.textContent='● Memuat data...'; el.style.color='#886211'; } else { el.textContent='● Tersinkron'; el.style.color='#226846'; el.title=lastSync ? 'Terakhir: '+new Date(lastSync).toLocaleString('id-ID') : ''; } }
function mail(text){Store.state.mail.unshift({time:new Date().toISOString(),text});}

function available(d){
  if(d==='Art Director'){
    const inflow = sum(Store.state.flows.filter(x=>x.type==='income'||x.type==='return'), x=>x.amount);
    const outflow = sum(Store.state.flows.filter(x=>x.type==='allocation'), x=>x.amount);
    const adExp = sum(Store.state.expenses.filter(x=>x.dept==='Art Director'), x=>x.amount);
    return inflow - outflow - adExp;
  }
  return sum(Store.state.flows.filter(x=>x.dept===d),x=>x.type==='allocation'?x.amount:x.type==='return'?-x.amount:0) - sum(Store.state.expenses.filter(x=>x.dept===d),x=>x.amount);
}
function center(){return sum(Store.state.flows,x=>x.type==='income'||x.type==='return'?x.amount:-x.amount);}

function table(headers,rows,opts){ const id='tbl-'+(++_tableCounter); const showButtons=opts!==false; const buttons=showButtons?`<div class="scroll-buttons noprint"><button type="button" onclick="scrollTable('${id}',-400)">← Geser Kiri</button><button type="button" onclick="scrollTable('${id}',400)">Geser Kanan →</button><button type="button" onclick="scrollTable('${id}',-99999)">⇤ Ke Awal</button><button type="button" onclick="scrollTable('${id}',99999)">Ke Akhir ⇥</button><button type="button" onclick="scrollTable('${id}','reset')">🔄 Reset</button><span class="scroll-info">Klik tombol untuk navigasi horizontal</span></div>`:''; return `<div class="table-block">${buttons}<div class="tablewrap" id="${id}"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div></div>`; }

function submitProfileRegister() {
  const name = ($('profile-name')?.value || '').trim();
  const dept = $('profile-dept')?.value;
  const code = ($('profile-admin-code')?.value || '').trim();
  const errEl = $('profile-error');
  errEl.classList.remove('show');
  const showErr = (m) => { errEl.textContent = m; errEl.classList.add('show'); };
  if (name.length < 2) return showErr('Nama minimal 2 karakter');
  if (!dept) return showErr('Role wajib dipilih');
  if (ROLE_CODES[dept] && !code) return showErr('Kode akses untuk role ini wajib diisi');
  const profile = { name, dept, registeredAt: new Date().toISOString(), isAdmin: ADMIN_ROLES.includes(dept) };
  localStorage.setItem('ichiflow_profile', JSON.stringify(profile));
  Session.profile = profile;
  Session.roleCode = code;
  role = dept;
  $('role').value = role;
  notice(`Profil tersimpan sebagai ${dept}. Masukkan kode proyek.`);
  renderPinLock();
}

function renderPinLock() {
  Session.page = 'pin'; Session.isUnlocked = false;
  const prof = Session.profile;
  const userLabel = prof ? `${esc(prof.name)} · ${esc(prof.dept)}` : '';
  showAuthLayer(`<div class="auth-page"><div class="auth-card"><div class="auth-logo">IchiFlow<span>.</span></div><div class="auth-tag">PRODUCTION FINANCE</div>${userLabel?`<p style="text-align:center;font-size:12px;color:#718077;margin-bottom:16px">Masuk sebagai <b>${userLabel}</b></p>`:''}<h2 class="auth-title">Masukkan Kode Proyek</h2><div id="pin-error" class="auth-error"></div><div style="margin:20px 0"><input type="password" id="project-code-input" placeholder="Kode Proyek" style="width:100%;padding:15px;font-size:18px;text-align:center;border-radius:12px;border:2px solid #cbd5ca"></div><button onclick="submitPin()" id="pin-submit">Buka Proyek</button><button class="secondary" onclick="logoutProfile()" style="margin-top:10px">← Ganti Profil</button></div></div>`);
  const input = document.getElementById('project-code-input');
  input.focus();
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitPin(); });
}

async function submitPin() {
  const code = document.getElementById('project-code-input')?.value.trim();
  const errEl = $('pin-error'); errEl.classList.remove('show');
  if (!code) { errEl.textContent = 'Kode wajib diisi'; errEl.classList.add('show'); return; }

  if (!isInTelegram()) {
    Session.isUnlocked = true; Session.lastActivity = Date.now();
    notice('Membuka proyek (mode lokal)...');
    await enterApp();
    return;
  }

  const btn = $('pin-submit'); btn.disabled = true; btn.textContent = 'Memeriksa...';
  try {
    const res = await API.verifyPin(code, { name: Session.profile?.name, role: Session.profile?.dept, roleCode: Session.roleCode || '' });
    if (res.ok && res.role) {
      Session.profile = { ...(Session.profile || {}), dept: res.role, access: res.access };
      localStorage.setItem('ichiflow_profile', JSON.stringify(Session.profile));
      role = res.role;
      filter = res.access === 'full' ? 'Semua' : res.role;
      Session.roleCode = '';
    }
    if (res.ok) {
      Session.isUnlocked = true; Session.lastActivity = Date.now();
      notice('Kode benar');
      await enterApp();
    } else {
      throw new Error(res.error || 'Kode salah');
    }
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Buka Proyek';
    errEl.textContent = e.message; errEl.classList.add('show');
    if(document.getElementById('project-code-input')) document.getElementById('project-code-input').value = '';
  }
}

async function enterApp() {
  hideAuthLayer();
  Session.page = 'app';
  if (Session.profile?.dept) { role = Session.profile.dept; $('role').value = role; }
  filter = all() ? 'Semua' : role;
  const lbl = document.getElementById('current-user-label');
  if (lbl && Session.profile) lbl.textContent = `👤 ${Session.profile.name} · ${Session.profile.dept}`;
  if (!Store.isRemoteLoaded()) await Store.loadRemote();
  await loadTiers(); // PERBAIKAN: Load tier agar tidak hilang setelah login
  syncDeptsFromStore();
  render();
  updateSyncIndicator();
}

function goHome() {
  Session.isUnlocked = false;
  renderPinLock();
}

function logoutProfile() {
  if (!confirm('Logout dan ganti profil?\n(Data TIDAK terhapus, hanya profil Anda yang dilupakan)')) return;
  localStorage.removeItem('ichiflow_profile');
  Session.profile = null;
  Session.isUnlocked = false;
  location.reload();
}

function rabItemDisplayStatus(item){if(item.status==='Ditolak')return 'Ditolak';if(item.status==='Draft'||item.status==='Diajukan')return item.status;const exp=Store.state.expenses.find(e=>e.rabItemId===item.id&&e.status==='Diverifikasi');return exp?'Dibeli':'Disetujui'}
function rabItemVariance(item){const exp=Store.state.expenses.find(e=>e.rabItemId===item.id&&e.status==='Diverifikasi');if(!exp)return null;const plan=total(item);return {plan,actual:exp.amount,diff:exp.amount-plan}}
function renderRABTable(items,showVendor){
  if(!items.length)return '<p class="empty">Belum ada data RAB.</p>';
  items.sort((a,b)=>{const s=(x,k)=>{const t=Session.tiers.find(t=>t.id===x[k]);return t?t.name:''};return (s(a,'tier1_id')||'').localeCompare(s(b,'tier1_id')||'')||(s(a,'tier2_id')||'').localeCompare(s(b,'tier2_id')||'')||(s(a,'tier3_id')||'').localeCompare(s(b,'tier3_id')||'')});
  const COL=10;
  const tblId='rabtbl-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
  let html=`<div class="rab-scroll-buttons noprint"><button type="button" onclick="scrollTable('${tblId}',-400)">← Geser Kiri</button><button type="button" onclick="scrollTable('${tblId}',400)">Geser Kanan →</button><button type="button" onclick="scrollTable('${tblId}',-99999)">⇤ Awal</button><button type="button" onclick="scrollTable('${tblId}',99999)">Akhir ⇥</button><button type="button" onclick="scrollTable('${tblId}','reset')">🔄 Reset</button></div>`;
  html+=`<div class="tablewrap" id="${tblId}"><table class="excel-table">`;
  html+=`<thead><tr><th style="width:40px">NO</th><th>DESKRIPSI</th><th style="width:60px">QTY</th><th style="width:70px">SATUAN</th><th style="width:60px">HARI</th><th style="width:70px">B/M/R</th><th style="width:110px">HARGA (Rp)</th><th style="width:130px">TOTAL (Rp)</th><th style="width:150px">STATUS</th><th style="width:150px">AKSI</th></tr></thead><tbody>`;
  const grouped={};
  items.forEach(it=>{const k1=it.tier1_id||'0',k2=it.tier2_id||'0',k3=it.tier3_id||'0';grouped[k1]=grouped[k1]||{};grouped[k1][k2]=grouped[k1][k2]||{};grouped[k1][k2][k3]=grouped[k1][k2][k3]||[];grouped[k1][k2][k3].push(it)});
  let grandTotal=0;
  for(const [t1_id,t2_group] of Object.entries(grouped)){
    const t1_name=Session.tiers.find(t=>t.id===t1_id)?.name||'Uncategorized';
    let t1Items=[];Object.values(t2_group).forEach(g=>Object.values(g).forEach(a=>t1Items.push(...a)));
    const t1Total=sum(t1Items,total);
    html+=`<tr class="tier-row"><td class="tier-1" colspan="${COL}">${esc(t1_name)}</td></tr>`;
    for(const [t2_id,t3_group] of Object.entries(t2_group)){
      const t2_name=Session.tiers.find(t=>t.id===t2_id)?.name||'Uncategorized';
      let t2Items=[];Object.values(t3_group).forEach(a=>t2Items.push(...a));
      const t2Total=sum(t2Items,total);
      html+=`<tr class="tier-row"><td class="tier-2" colspan="${COL}">&nbsp;&nbsp;${esc(t2_name)}</td></tr>`;
      for(const [t3_id,t4_items] of Object.entries(t3_group)){
        const t3_name=Session.tiers.find(t=>t.id===t3_id)?.name||'Uncategorized';
        html+=`<tr class="tier-row"><td class="tier-3" colspan="${COL}">&nbsp;&nbsp;&nbsp;&nbsp;${esc(t3_name)}</td></tr>`;
        t4_items.forEach((it,idx)=>{
          const status=rabItemDisplayStatus(it);
          const variance=rabItemVariance(it);
          const varianceHtml=variance?`<div class="mini ${variance.diff>0?'variance-over':'variance-disc'}" style="margin-top:3px">${variance.diff>0?'⚠ Over':'✓ Disc'}: ${money(Math.abs(variance.diff))}</div>`:'';
          const actions=`<button class="secondary" onclick="budgetForm('${it.id}')" style="padding:4px 8px;font-size:11px" title="Edit">✏️</button>${it.status==='Draft'?`<button onclick="statusBudget('${it.id}','Diajukan')" style="padding:4px 8px;font-size:11px" title="Ajukan">📤</button>`:''}${canApprove()&&it.status==='Diajukan'?`<button onclick="statusBudget('${it.id}','Disetujui')" style="padding:4px 8px;font-size:11px;background:#226846" title="Setujui">✓</button>`:''}${canApprove()&&it.status==='Diajukan'?`<button class="danger" onclick="statusBudget('${it.id}','Ditolak')" style="padding:4px 8px;font-size:11px" title="Tolak">✗</button>`:''}${it.status==='Draft'?`<button class="danger" onclick="removeBudget('${it.id}')" style="padding:4px 8px;font-size:11px" title="Hapus">🗑️</button>`:''}`;
          html+=`<tr class="item-row"><td style="text-align:center;color:#6b7280">${idx+1}</td><td>${esc(it.item)}</td><td style="text-align:center">${it.qty}</td><td style="text-align:center">${esc(it.unit||'-')}</td><td style="text-align:center">${it.hari||1}</td><td style="text-align:center"><b>${esc(it.bmr||'-')}</b></td><td class="num" style="text-align:right;font-family:monospace">${money(it.price)}</td><td class="num" style="text-align:right;font-family:monospace"><b>${money(total(it))}</b></td><td style="text-align:center">${tag(status)}${varianceHtml}</td><td class="actions" style="white-space:nowrap;text-align:center">${actions}</td></tr>`;
        });
      }
      html+=`<tr><td class="sub-total" colspan="${COL}">Sub Total ${esc(t2_name)} &nbsp;·&nbsp; ${money(t2Total)}</td></tr>`;
    }
    grandTotal+=t1Total;
  }
  html+=`<tr><td class="grand-total" colspan="${COL}">GRAND TOTAL PRODUCTION &nbsp;·&nbsp; ${money(grandTotal)}</td></tr>`;
  html+='</tbody></table></div>';
  return html;
}

function renderExpenseTable(items) {
  if (!items.length) return '<p class="empty">Belum ada data pengeluaran.</p>';
  const rows = items.map((x,idx) => {
    let statusColor = '';
    const rabItem = Store.state.rabArchives.flatMap(r=>r.items).find(i=>i.id===x.rabItemId);
    const budgetPrice = rabItem ? total(rabItem) : 0;
    if (x.status === 'Diverifikasi' && budgetPrice > 0) {
       if (x.amount > budgetPrice) statusColor = 'text-danger';
       else if (x.amount < budgetPrice) statusColor = 'text-success';
    }
    return `<tr><td class="no">${idx+1}</td><td>${esc(x.date)}<br><small>${esc(x.dept)}</small></td><td>${esc(x.title)}${x._by?`<br><small style="color:#718077">oleh ${esc(x._by.name)} · ${esc(x._by.role)}</small>`:''}</td><td style="font-size:11px;color:#0284c7">${esc(x.vendor||'-')}</td><td style="text-align:center">${x.qty||1}</td><td style="text-align:center">${esc(x.unit||'-')}</td><td style="text-align:center">${x.hari||1}</td><td style="text-align:center">${esc(x.bmr||'-')}</td><td class="num ${statusColor}">${money(x.amount)}</td><td>${tag(x.status)}</td><td class="actions">${x.status!=='Diverifikasi'?`<button class="secondary" onclick="expenseForm('${x.id}')">Edit</button>${all()?`<button class="danger" onclick="removeExpense('${x.id}')">Hapus</button>`:''}`:''}${canApprove()&&x.status!=='Diverifikasi'?`<button onclick="verifyExpense('${x.id}')">Verifikasi</button>`:''}</td></tr>`;
  });
  return table(['No','Tanggal','Deskripsi','Vendor','Qty','Satuan','Hari','B/M/R','Harga','Status','Aksi'], rows);
}

function renderTierTree() {
  const t1s = Session.tiers.filter(t=>t.level===1).sort((a,b)=>a.name.localeCompare(b.name));
  if (!t1s.length) return '<p class="empty">Belum ada Tier. Klik "+ Tambah Tier 1".</p>';
  let html = '<div style="padding-left:10px">';
  t1s.forEach(t1 => {
    html += `<div style="margin-bottom:10px; background:#e6f0fa; padding:10px; border-radius:8px;"><b>${esc(t1.name)}</b> (Tier 1)<button class="secondary" style="padding:4px 8px;font-size:10px;margin-left:10px" onclick="tierForm(2, '${t1.id}')">+ Tier 2</button>${all()?`<button class="danger" style="padding:4px 8px;font-size:10px;margin-left:5px" onclick="deleteTier('${t1.id}')">Hapus</button>`:''}</div>`;
    const t2s = Session.tiers.filter(t=>t.level===2 && t.parent_id===t1.id).sort((a,b)=>a.name.localeCompare(b.name));
    t2s.forEach(t2 => {
      html += `<div style="margin-left:20px; margin-bottom:8px; background:#e6f7ea; padding:8px; border-radius:8px;"><b>${esc(t2.name)}</b> (Tier 2)<button class="secondary" style="padding:2px 6px;font-size:10px;margin-left:10px" onclick="tierForm(3, '${t2.id}')">+ Tier 3</button>${all()?`<button class="danger" style="padding:2px 6px;font-size:10px;margin-left:5px" onclick="deleteTier('${t2.id}')">Hapus</button>`:''}</div>`;
      const t3s = Session.tiers.filter(t=>t.level===3 && t.parent_id===t2.id).sort((a,b)=>a.name.localeCompare(b.name));
      t3s.forEach(t3 => {
        html += `<div style="margin-left:40px; margin-bottom:5px; background:#fde6f0; padding:6px; border-radius:8px;"><b>${esc(t3.name)}</b> (Tier 3)${all()?`<button class="danger" style="padding:2px 6px;font-size:10px;margin-left:5px" onclick="deleteTier('${t3.id}')">Hapus</button>`:''}</div>`;
      });
    });
  });
  html += '</div>';
  return html;
}

function tierForm(level, parentId = null) {
  openForm(`Tambah Tier ${level}`, field('Nama Tier', 'name', '', 'text', 'required'), async (v) => {
    await API.addTier({ id: uid(), parent_id: parentId, level, name: v.name.trim() });
    await loadTiers(); notice('Tier berhasil ditambahkan'); render();
  });
}
async function deleteTier(id) {
  if (!confirm('Hapus Tier ini?')) return;
  try { await API.deleteTier(id); await loadTiers(); notice('Tier dihapus'); render(); } catch (e) { notice(e.message); }
}

async function hardResetData(){
  if(!(role==='Admin'||isSuperAdmin())){
    return notice('Hanya Super Admin yang dapat melakukan Hard Reset.');
  }

  const counts = {
    rab: Store.state.rabArchives.reduce((a,r)=>a+(r.items?.length||0),0),
    expenses: Store.state.expenses.length,
    requests: Store.state.requests.length,
    flows: Store.state.flows.length,
    journals: Store.state.journals.length,
    tiers: Session.tiers.length
  };
  if(!confirm(`⚠️ HARD RESET — HAPUS SEMUA\n\nIni akan MENGHAPUS PERMANEN untuk SEMUA USER:\n• Profil (nama + divisi)\n• RAB items: ${counts.rab}\n• Pengeluaran: ${counts.expenses}\n• Pengajuan: ${counts.requests}\n• Arus kas: ${counts.flows}\n• Jurnal: ${counts.journals}\n• Tier: ${counts.tiers}\n• Semua data di Cloudflare D1\n\nLanjutkan?`)) return;
  if(!confirm('KONFIRMASI TERAKHIR: Yakin hapus SEMUA data? Tidak bisa dikembalikan!')) return;
  
  notice('Menghapus semua data (termasuk server)...');
  try {
    if (API_CONFIG.enabled && isInTelegram()) {
      try {
        await loadTiers();
        for (const t of Session.tiers) { try { await API.deleteTier(t.id); } catch(e) {} }
        Session.tiers = [];
      } catch(e) { console.warn('Reset tier:', e.message); }
    }
    
    await Store.reset();
    
    if (localStorage.getItem('ichiflow_force_reset') === 'true') {
      notice('⚠️ Data lokal bersih, tapi server gagal. Cek koneksi & coba lagi.');
      return;
    }
    
    const keys = Object.keys(localStorage).filter(k => k.startsWith('ichiflow'));
    keys.forEach(k => localStorage.removeItem(k));
    
    notice('✅ Semua data terhapus. Memuat ulang...');
    setTimeout(() => location.reload(), 1500);
  } catch(e) {
    console.error('[HARD RESET]', e);
    notice('Gagal: ' + e.message);
  }
}

function selectRabFile(){const inp=$('rabExcelFile');if(inp){inp.value='';inp.click()}}
async function importRabFile(file){
  if(!file)return;
  try{
    if(!window.XLSX)throw Error('Library XLSX belum termuat.');
    const wb=XLSX.read(await file.arrayBuffer());
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});
    if(!rows.length)throw Error('Sheet kosong.');
    const items=[];const newTiers=[];const cache=new Map();
    let t1Id=null,t2Id=null,t3Id=null,detectedDept=null;
    function ensureTier(level,name,parentId){const key=`${level}|${parentId||''}|${name}`;if(cache.has(key))return cache.get(key);const ex=Session.tiers.find(t=>t.level===level&&t.name===name&&(level===1||t.parent_id===parentId));if(ex){cache.set(key,ex.id);return ex.id}const id=uid();newTiers.push({id,level,name,parent_id:parentId});cache.set(key,id);return id}
    function detectDept(name){const m=DEPTS.find(d=>d.toLowerCase()===String(name||'').toLowerCase());return m||null}
    for(let i=1;i<rows.length;i++){
      const r=rows[i]||[];const a=String(r[0]??'').trim();const b=String(r[1]??'').trim();
      if(!a&&!b)continue;
      if(/^no$/i.test(a)&&/deskripsi/i.test(b))continue;
      if(/sub\s*total|grand\s*total/i.test(b))continue;
      const c=r[2],d=r[3],e=r[4],f=r[5],g=r[6];
      const hasQty=c!==''&&c!==undefined&&c!==null&&!isNaN(Number(c));
      if(!hasQty){
        if(!a&&b){t1Id=ensureTier(1,b,null);if(!detectedDept)detectedDept=detectDept(b);t2Id=null;t3Id=null;}
        else if(/^[a-z]$/i.test(a)){if(b)t3Id=ensureTier(3,b,t2Id);}
        else if(/^\d+$/.test(a)){if(b)t2Id=ensureTier(2,b,t1Id);t3Id=null;}
        else{const t1Name=a||b;if(t1Name){t1Id=ensureTier(1,t1Name,null);if(!detectedDept)detectedDept=detectDept(t1Name);t2Id=null;t3Id=null;}}
        continue;
      }
      if(!b)continue;
      const qty=Number(c)||0;const hari=Number(e)||1;const bmr=String(f||'Buy').trim();
      let priceRaw=g;if(typeof priceRaw==='string'&&priceRaw.startsWith('='))priceRaw=0;
      const price=Math.round(Number(priceRaw)||0);
      items.push({id:uid(),dept:detectedDept||(all()?'Props':role),tier1_id:t1Id,tier2_id:t2Id,tier3_id:t3Id,item:b,qty,hari,unit:String(d||'').trim(),bmr,price,status:'Draft'});
    }
    if(!items.length)throw Error('Tidak ada item yang bisa diimpor.');
    if(!confirm(`Ditemukan ${items.length} item dan ${newTiers.length} tier baru.\nLanjutkan?`))return;
    for(const t of newTiers){try{await API.addTier(t)}catch(err){console.warn('Tier gagal',err.message)}}
    await loadTiers();
    let activeRab=Store.state.rabArchives.find(r=>r.id===Store.state.activeRabId);
    if(!activeRab){activeRab={id:uid(),name:'RAB '+file.name.replace(/\.(xlsx|csv)$/i,''),uploadedAt:new Date().toISOString(),items:[]};Store.state.rabArchives.push(activeRab);Store.state.activeRabId=activeRab.id}
    activeRab.items.push(...items);
    save(`Import RAB: ${items.length} item dari ${file.name}`);
    notice(`${items.length} item diimpor`);
  }catch(e){console.error(e);notice('Gagal impor: '+e.message)}
}
function deleteActiveRab(){
  const activeRab=Store.state.rabArchives.find(r=>r.id===Store.state.activeRabId);

  Store.state.rabArchives=Store.state.rabArchives.filter(r=>r.id!==activeRab.id);
  Store.state.activeRabId=Store.state.rabArchives[0]?.id||null;
  save(`Hapus RAB aktif: ${activeRab.name}`);
}

function renderBankMatch(){const sts=Store.state.bankStatements;if(!sts.length)return '<div class="panel"><p class="mini">Upload dulu.</p></div>';const cur=window._bankStatement||sts[0].id;const st=sts.find(s=>s.id===cur);if(!st)return '';return `<div class="panel"><div class="row" style="margin-bottom:14px"><label>Statement <select onchange="window._bankStatement=this.value;render()">${sts.map(s=>`<option value="${s.id}" ${s.id===cur?'selected':''}>${esc(s.fileName)}</option>`).join('')}</select></label><button onclick="runAutoMatch('${st.id}')">Auto-Match</button></div>${table(['Tanggal','Keterangan','Nominal','Status','Jurnal','Aksi'],st.rows.map((r,i)=>{const jr=r.matchedJournalId?Store.state.journals.find(j=>j.id===r.matchedJournalId):null;return `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.description)}</td><td class="num">${money(r.amount)}</td><td>${r.matched?tag('Cocok'):tag('Tidak Cocok')}</td><td>${jr?`<small>${esc(jr.number)}</small>`:'—'}</td><td class="actions">${!r.matched?`<button class="secondary" onclick="manualMatch('${st.id}',${i})">Cocok</button>`:`<button class="secondary" onclick="unmatch('${st.id}',${i})">Batal</button>`}</td></tr>`;}))}</div>`;}

async function uploadBankStatement(file){if(!file)return;try{const text=await file.text();const rows=parseBankCSV(text);if(!rows.length)throw Error('Tidak ada baris valid.');Store.state.bankStatements.push({id:uid(),fileName:file.name,uploadedAt:new Date().toISOString(),rows:rows.map(r=>({...r,matched:false,matchedJournalId:null}))});save(`Upload: ${file.name}`);}catch(e){notice(e.message);}}
function parseBankCSV(text){const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)throw Error('Terlalu pendek.');const sep=lines[0].includes(';')?';':',';const h=lines[0].split(sep).map(x=>x.trim().toLowerCase());const dI=h.findIndex(x=>/tanggal|date/.test(x)),dsI=h.findIndex(x=>/keterangan|deskripsi|description/.test(x)),aI=h.findIndex(x=>/nominal|amount|jumlah/.test(x));if(dI<0||dsI<0||aI<0)throw Error('Kolom?');const rows=[];for(let i=1;i<lines.length;i++){const c=lines[i].split(sep).map(x=>x.trim().replace(/^"|"$/g,''));const dt=normalizeDate(c[dI]),amt=parseAmount(c[aI]);if(dt&&amt!==null)rows.push({date:dt,description:c[dsI]||'',amount:amt});}return rows;}
function normalizeDate(s){if(!s)return null;s=String(s).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;return null;}
function parseAmount(s){if(s==null)return null;let str=String(s).trim();if(!str)return null;const p=str.startsWith('(')&&str.endsWith(')');str=str.replace(/[()]/g,'').replace(/rp/gi,'').replace(/\s/g,'').replace(/[^\d,.-]/g,'');const d=str.lastIndexOf('.'),c=str.lastIndexOf(',');if(d>=0&&c>=0){if(c>d)str=str.replace(/\./g,'').replace(',','.');else str=str.replace(/,/g,'');}else if(c>=0){const dec=str.length-c-1;str=dec>0&&dec<=2?str.replace(',','.'):str.replace(/,/g,'');}else if((str.match(/\./g)||[]).length>1)str=str.replace(/\./g,'');else if(d>=0&&str.length-d-1===3)str=str.replace('.','');const n=Number(str);return Number.isFinite(n)?(p?-Math.abs(n):n):null;}
function runAutoMatch(stId){const st=Store.state.bankStatements.find(s=>s.id===stId);if(!st)return;let m=0;for(const r of st.rows){if(r.matched)continue;const j=findMatchingJournal(r);if(j){r.matched=true;r.matchedJournalId=j.id;m++;}}save(`Auto-match: ${m}`);notice(`Cocok: ${m}/${st.rows.length}`);}
function findMatchingJournal(row){const cashIds=Store.state.accounts.filter(a=>/^11\d\d/.test(a.code)).map(a=>a.id);for(const j of Store.state.journals){if(j.status!=='posted')continue;if(Math.abs(daysBetween(j.date,row.date))>3)continue;let delta=0;for(const l of j.lines)if(cashIds.includes(l.accountId))delta+=l.debit-l.credit;if(delta!==0&&Math.abs(delta-row.amount)<=1)return j;}return null;}
function daysBetween(d1,d2){return (new Date(d1+'T00:00:00').getTime()-new Date(d2+'T00:00:00').getTime())/86400000;}
function manualMatch(stId,idx){const st=Store.state.bankStatements.find(s=>s.id===stId);if(!st)return;const row=st.rows[idx];const js=Store.state.journals.filter(j=>j.status==='posted').slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,50);const opts_=js.map(j=>`<option value="${j.id}">${esc(j.date)} · ${esc(j.number)} · ${esc(j.description.slice(0,40))}</option>`).join('');$('modal').innerHTML=`<h2>Cocok Manual</h2><p>${fmtDate(row.date)} · ${esc(row.description)} · ${money(row.amount)}</p><form id="form"><label>Jurnal<select name="jid">${opts_}</select></label><div class="row" style="margin-top:16px"><button type="submit">OK</button><button type="button" class="secondary" onclick="$('modal').close()">Batal</button></div></form>`;$('form').onsubmit=e=>{e.preventDefault();row.matched=true;row.matchedJournalId=new FormData(e.target).get('jid');save('Match');$('modal').close();};$('modal').showModal();}
function unmatch(stId,idx){const st=Store.state.bankStatements.find(s=>s.id===stId);if(!st)return;st.rows[idx].matched=false;st.rows[idx].matchedJournalId=null;save('Unmatch');}
function viewStatement(id){const st=Store.state.bankStatements.find(s=>s.id===id);if(!st)return;$('modal').innerHTML=`<h2>${esc(st.fileName)}</h2>${table(['Tanggal','Keterangan','Nominal','Status'],st.rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.description)}</td><td class="num">${money(r.amount)}</td><td>${r.matched?tag('Cocok'):tag('Tidak Cocok')}</td></tr>`),false)}<div class="row" style="margin-top:16px"><button class="secondary" onclick="$('modal').close()">Tutup</button></div>`;$('modal').showModal();}

function renderLedgerPage(){const sel=Store.state.accounts.slice().sort((a,b)=>a.code.localeCompare(b.code));if(!sel.length)return '<div class="panel"><p>Belum ada akun.</p></div>';const cur=window._ledgerAccount||sel[0].id;const lg=Accounting.ledger(cur);return `<div class="panel"><div class="row" style="margin-bottom:14px"><label>Akun<select onchange="window._ledgerAccount=this.value;render()">${sel.map(a=>`<option value="${a.id}" ${a.id===cur?'selected':''}>${esc(a.code)} · ${esc(a.name)}</option>`).join('')}</select></label></div>${table(['Tanggal','No','Keterangan','Debit','Kredit','Saldo'],[`<tr><td colspan="5"><i>Awal</i></td><td class="num">${money(lg.opening)}</td></tr>`,...lg.rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.number)}</td><td>${esc(r.description)}</td><td class="num">${r.debit?money(r.debit):'—'}</td><td class="num">${r.credit?money(r.credit):'—'}</td><td class="num"><b>${money(r.balance)}</b></td></tr>`),`<tr><td colspan="5"><b>Akhir</b></td><td class="num"><b>${money(lg.closing)}</b></td></tr>`])}</div>`;}
function renderTrialBalance(){const tb=Accounting.trialBalance();const d=tb.reduce((s,r)=>s+r.debit,0),c=tb.reduce((s,r)=>s+r.credit,0);return `<div class="panel"><div class="row" style="margin-bottom:14px"><button class="secondary" onclick="window.print()">Cetak</button></div>${table(['Kode','Akun','Debit','Kredit'],[...tb.map(r=>`<tr><td>${esc(r.account.code)}</td><td>${esc(r.account.name)}</td><td class="num">${r.debit?money(r.debit):'—'}</td><td class="num">${r.credit?money(r.credit):'—'}</td></tr>`),`<tr><td colspan="2"><b>TOTAL</b></td><td class="num"><b>${money(d)}</b></td><td class="num"><b>${money(c)}</b></td></tr>`])}</div>`;}
function accountForm(id){const a=id?Store.state.accounts.find(x=>x.id===id):{};openForm(id?'Edit':'Akun Baru',field('Kode','code',a.code||'','text','required maxlength="10"')+field('Nama','name',a.name||'','text','required maxlength="80"')+pick('Tipe','type',['asset','liability','equity','revenue','expense'],a.type||'expense')+pick('Saldo Normal','normalBalance',['debit','credit'],a.normalBalance||'debit'),v=>{if(id)Object.assign(a,{code:v.code.trim(),name:v.name.trim(),type:v.type,normalBalance:v.normalBalance});else Store.state.accounts.push({id:uid(),code:v.code.trim(),name:v.name.trim(),type:v.type,normalBalance:v.normalBalance,parentId:null,isActive:true,createdAt:Date.now()});save(`Akun ${v.code}`);});}
function toggleAccount(id){const a=Store.state.accounts.find(x=>x.id===id);if(!a)return;a.isActive=!a.isActive;save(`${a.isActive?'On':'Off'} ${a.code}`);}
function journalForm(){const accs=Store.state.accounts.filter(a=>a.isActive).sort((a,b)=>a.code.localeCompare(b.code));if(!accs.length)return notice('Belum ada akun aktif.');const optsAcc=accs.map(a=>`<option value="${a.id}">${esc(a.code)} · ${esc(a.name)}</option>`).join('');const line=()=>`<div class="grid" style="grid-template-columns:2fr 1fr 1fr;margin-bottom:8px"><select name="acc[]">${optsAcc}</select><input name="dr[]" type="number" min="0" step="1" placeholder="Debit"><input name="cr[]" type="number" min="0" step="1" placeholder="Kredit"></div>`;openForm('Jurnal Manual',field('Tanggal','date',today(),'date','required')+field('Keterangan','description','','text','required')+`<div class="full" style="margin-top:12px"><label>Baris</label><div id="jlines">${line()}${line()}</div><button type="button" class="secondary" onclick="addJLine()">+ Baris</button></div>`,v=>{const accs_=[].concat(v['acc[]']||[]),drs=[].concat(v['dr[]']||[]),crs=[].concat(v['cr[]']||[]);const lines=accs_.map((aid,i)=>({accountId:aid,debit:Number(drs[i])||0,credit:Number(crs[i])||0})).filter(l=>l.debit||l.credit);Accounting.createJournal({date:v.date,description:v.description.trim(),lines});save(`Jurnal: ${v.description}`);});}
function addJLine(){const accs=Store.state.accounts.filter(a=>a.isActive).sort((a,b)=>a.code.localeCompare(b.code));const optsAcc=accs.map(a=>`<option value="${a.id}">${esc(a.code)} · ${esc(a.name)}</option>`).join('');$('jlines').insertAdjacentHTML('beforeend',`<div class="grid" style="grid-template-columns:2fr 1fr 1fr;margin-bottom:8px"><select name="acc[]">${optsAcc}</select><input name="dr[]" type="number" min="0" step="1" placeholder="Debit"><input name="cr[]" type="number" min="0" step="1" placeholder="Kredit"></div>`);}
function journalDetail(id){const j=Store.state.journals.find(x=>x.id===id);if(!j)return;const lines=j.lines.map(l=>{const a=Accounting.accById(l.accountId);return `<tr><td>${esc(a?a.code+' · '+a.name:'?')}</td><td>${esc(l.description||'')}</td><td class="num">${l.debit?money(l.debit):'—'}</td><td class="num">${l.credit?money(l.credit):'—'}</td></tr>`;}).join('');$('modal').innerHTML=`<h2>${esc(j.number)}</h2><p>${esc(j.date)} · ${esc(j.description)}</p>${table(['Akun','Ket','Debit','Kredit'],[lines],false)}<div class="row" style="margin-top:16px"><button class="secondary" onclick="$('modal').close()">Tutup</button></div>`;$('modal').showModal();}
function exportJournals(){const rows=[['Tanggal','No','Keterangan','Referensi','Akun','Debit','Kredit']];for(const j of Store.state.journals)for(const l of j.lines){const a=Accounting.accById(l.accountId);rows.push([j.date,j.number,j.description,j.reference,a?a.code+' '+a.name:'',l.debit,l.credit]);}download('Jurnal.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv');}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  if(window.Telegram?.WebApp){ try{ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }catch(e){} }
  await new Promise(r=>setTimeout(r,400));
  Session.user = window.Telegram?.WebApp?.initDataUnsafe?.user || {};

  const savedProfile = localStorage.getItem('ichiflow_profile');
  if (!savedProfile) { renderProfileRegister(); return; }

  try {
    const p = JSON.parse(savedProfile);
    Session.profile = p;
    role = p.dept || 'Props';
    $('role').value = role;
  } catch(e) {
    localStorage.removeItem('ichiflow_profile');
    renderProfileRegister();
    return;
  }

  renderPinLock();
})();
</script></body></html>
