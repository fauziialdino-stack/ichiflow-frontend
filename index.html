'use strict';

/* ============================================================
   KONFIGURASI API
   ============================================================ */
const API_CONFIG = {
  baseUrl: 'https://ichiflow-worker.ichiflow.workers.dev',
  projectKey: 'film-rengasdengklok',
  timeout: 15000,
  enabled: true,
};

function getInitData() {
  try {
    if (window.Telegram?.WebApp?.initData && window.Telegram.WebApp.initData.length > 0) {
      return window.Telegram.WebApp.initData;
    }
  } catch (e) {}
  return null;
}

function isInTelegram() {
  return !!getInitData();
}

async function apiFetch(path, options = {}) {
  if (!API_CONFIG.enabled) throw new Error('API dinonaktifkan');
  const initData = getInitData();
  if (!initData) throw new Error('initData Telegram tidak tersedia.');
  const url = API_CONFIG.baseUrl + path;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), API_CONFIG.timeout);
  try {
    const response = await fetch(url, {
      ...options,
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': initData,
        ...(options.headers || {}),
      },
    });
    clearTimeout(timeoutId);
    if (!response.ok) {
      const errBody = await response.json().catch(() => ({}));
      throw new Error(errBody.error || `HTTP ${response.status}`);
    }
    return await response.json();
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') throw new Error('Request timeout');
    throw e;
  }
}

const API = {
  async getMe() { return await apiFetch('/api/me'); },
  async getState() { return await apiFetch('/api/state'); },
  async saveState(state) {
    return await apiFetch('/api/state', {
      method: 'PUT',
      body: JSON.stringify({ state }),
    });
  },
  async getSyncLog() { return await apiFetch('/api/sync-log'); },
  async health() { return await apiFetch('/api/health'); },
};

const ConnectionStatus = {
  online: null,
  lastCheck: 0,
  lastError: null,
  listeners: [],
  async check() {
    if (!isInTelegram()) {
      this.online = false;
      this.lastError = 'Tidak di Telegram (mode lokal)';
      this.lastCheck = Date.now();
      this.notify();
      return false;
    }
    try {
      await API.getMe();
      this.online = true;
      this.lastError = null;
    } catch (e) {
      this.online = false;
      this.lastError = e.message;
    }
    this.lastCheck = Date.now();
    this.notify();
    return this.online;
  },
  notify() {
    for (const fn of this.listeners) {
      try { fn(this.online, this.lastError); } catch {}
    }
  },
  subscribe(fn) { this.listeners.push(fn); },
};

/* ============================================================
   KONSTANTA & UTILITAS
   ============================================================ */
const DEPTS=['Art Grip','Builder','Props','MockUp','Aging','Grafis'];
const AKUN_COA_MAP={'Art Grip':'5200','Builder':'5210','Props':'5220','MockUp':'5230','Aging':'5240','Grafis':'5250'};
let role='Manager Finance',page='Dashboard',filter='Semua';
let accountingTab='coa',hrTab='employees',arTab='payable',bankTab='upload';
const tg=window.Telegram?.WebApp;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'Rp'+Number(Math.round(n||0)).toLocaleString('id-ID');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const today=()=>new Date().toLocaleDateString('en-CA');
const thisMonth=()=>today().slice(0,7);
const all=()=>['Manager Finance','Direktur'].includes(role);
const dept=()=>all()?filter:role;
const scoped=rows=>rows.filter(x=>dept()==='Semua'||x.dept===dept());
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
const total=x=>Math.round((x.qty||0)*(x.price||0));
const opts=(xs,v)=>xs.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const tag=(s,cls)=>`<span class="tag ${cls||(['Disetujui','Diverifikasi','Selesai','posted','Lunas','Cocok','Dibayar','Aktif'].includes(s)?'ok':['Ditolak','Batal','Tidak Cocok'].includes(s)?'bad':'wait')}">${esc(s)}</span>`;
function notice(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000);}
function download(name,data,type='text/plain'){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function fmtDate(d){if(!d)return'—';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}

/* ============================================================
   STORE LAYER (HYBRID dengan MERGE anti-hilang)
   ============================================================ */
const Store=(()=>{
  const KEY='ichiflow_v3';
  const SYNC_KEY='ichiflow_last_sync';
  let cache=null;
  let syncing=false;
  let syncTimer=null;
  let remoteLoaded=false;
  let pendingSyncAfterLoad=false;

  function blank(){return{
    version:3,project:'Film Rengasdengklok',
    accounts:[],requests:[],flows:[],expenses:[],
    journals:[],audit:[],mail:[],
    payables:[],receivables:[],fixedAssets:[],depreciationRuns:[],
    taxRecords:[],employees:[],payrolls:[],
    bankStatements:[],bankMatches:[],
    activeRabId:null,rabArchives:[],
    counters:{journal:0,payable:0,receivable:0,asset:0,payroll:0,statement:0}
  }}

  function seedCOA(s){
    const base=[
      ['1100','Kas Pusat','asset','debit',null],['1110','Kas Departemen','asset','debit','1100'],
      ['1120','Bank','asset','debit','1100'],['1130','Kas Kecil','asset','debit','1100'],
      ['1200','Piutang Klien','asset','debit',null],['1210','Piutang Usaha Lain','asset','debit','1200'],
      ['1300','Persediaan Produksi','asset','debit',null],['1310','Sewa Dibayar Dimuka','asset','debit',null],
      ['1320','PPN Masukan','asset','debit',null],
      ['1500','Aset Tetap','asset','debit',null],['1510','Tanah','asset','debit','1500'],
      ['1520','Bangunan','asset','debit','1500'],['1530','Kendaraan','asset','debit','1500'],
      ['1540','Peralatan Produksi','asset','debit','1500'],['1550','Perabot & Elektronik','asset','debit','1500'],
      ['1590','Akumulasi Penyusutan','asset','credit','1500'],
      ['2100','Hutang Usaha','liability','credit',null],['2110','Hutang Gaji','liability','credit',null],
      ['2120','Hutang BPJS Kesehatan','liability','credit',null],['2130','Hutang BPJS JHT','liability','credit',null],
      ['2140','Hutang BPJS JP','liability','credit',null],['2200','Hutang Pajak','liability','credit',null],
      ['2210','Hutang PPN Keluaran','liability','credit','2200'],['2220','Hutang PPh 21','liability','credit','2200'],
      ['2230','Hutang PPh 23','liability','credit','2200'],['2240','Hutang PPh 4(2)','liability','credit','2200'],
      ['2250','Hutang PPh 25/29','liability','credit','2200'],
      ['3100','Modal Proyek','equity','credit',null],['3200','Laba Ditahan','equity','credit',null],
      ['4100','Pendapatan Klien','revenue','credit',null],['4200','Pendapatan Lain','revenue','credit',null],
      ['5100','Beban Produksi','expense','debit',null],['5200','Beban Art Grip','expense','debit','5100'],
      ['5210','Beban Builder','expense','debit','5100'],['5220','Beban Props','expense','debit','5100'],
      ['5230','Beban MockUp','expense','debit','5100'],['5240','Beban Aging','expense','debit','5100'],
      ['5250','Beban Grafis','expense','debit','5100'],['5300','Beban Operasional','expense','debit',null],
      ['5310','Beban Gaji','expense','debit','5300'],['5320','Beban BPJS Kesehatan','expense','debit','5300'],
      ['5330','Beban BPJS JHT','expense','debit','5300'],['5340','Beban BPJS JP','expense','debit','5300'],
      ['5350','Beban Sewa','expense','debit','5300'],['5360','Beban Listrik & Air','expense','debit','5300'],
      ['5370','Beban Transportasi','expense','debit','5300'],['5380','Beban Konsumsi','expense','debit','5300'],
      ['5390','Beban Lain','expense','debit','5300'],['5400','Beban Penyusutan','expense','debit',null],
      ['5500','Beban Pajak Final','expense','debit',null]
    ];
    const now=Date.now();
    s.accounts=base.map(([code,name,type,nb,parentCode])=>({id:uid(),code,name,type,normalBalance:nb,parentId:null,parentCode,isActive:true,createdAt:now}));
    const byCode=Object.fromEntries(s.accounts.map(a=>[a.code,a.id]));
    s.accounts.forEach(a=>{if(a.parentCode)a.parentId=byCode[a.parentCode];});
  }

  function migrate(c){
    if(!c.activeRabId)c.activeRabId=null;
    if(!c.rabArchives)c.rabArchives=[];
    c.payables=c.payables||[];c.receivables=c.receivables||[];
    c.fixedAssets=c.fixedAssets||[];c.depreciationRuns=c.depreciationRuns||[];
    c.taxRecords=c.taxRecords||[];c.employees=c.employees||[];
    c.payrolls=c.payrolls||[];c.bankStatements=c.bankStatements||[];c.bankMatches=c.bankMatches||[];
    c.counters=Object.assign({journal:0,payable:0,receivable:0,asset:0,payroll:0,statement:0},c.counters||{});
    if(!c.accounts||!c.accounts.length)seedCOA(c);
    c.version=3;
    return c;
  }

  function countData(s){
    if(!s) return 0;
    return (s.expenses?.length||0) + (s.requests?.length||0) + (s.flows?.length||0) +
           (s.journals?.length||0) + (s.payables?.length||0) + (s.receivables?.length||0) +
           (s.fixedAssets?.length||0) + (s.employees?.length||0) + (s.payrolls?.length||0) +
           (s.bankStatements?.length||0) +
           (s.rabArchives?.reduce((a,r)=>a+(r.items?.length||0),0)||0);
  }

  function mergeArray(a, b) {
    const map = new Map();
    for (const item of (a||[])) if(item?.id) map.set(item.id, item);
    for (const item of (b||[])) if(item?.id) map.set(item.id, item);
    return Array.from(map.values());
  }

  function mergeStates(local, remote){
    const merged = migrate(JSON.parse(JSON.stringify(remote)));
    merged.accounts = mergeArray(local.accounts, remote.accounts);
    merged.requests = mergeArray(local.requests, remote.requests);
    merged.flows = mergeArray(local.flows, remote.flows);
    merged.expenses = mergeArray(local.expenses, remote.expenses);
    merged.journals = mergeArray(local.journals, remote.journals);
    merged.payables = mergeArray(local.payables, remote.payables);
    merged.receivables = mergeArray(local.receivables, remote.receivables);
    merged.fixedAssets = mergeArray(local.fixedAssets, remote.fixedAssets);
    merged.employees = mergeArray(local.employees, remote.employees);
    merged.payrolls = mergeArray(local.payrolls, remote.payrolls);
    merged.bankStatements = mergeArray(local.bankStatements, remote.bankStatements);
    merged.audit = mergeArray(local.audit, remote.audit);
    merged.mail = mergeArray(local.mail, remote.mail);
    merged.depreciationRuns = mergeArray(local.depreciationRuns, remote.depreciationRuns);
    merged.taxRecords = mergeArray(local.taxRecords, remote.taxRecords);

    const rabMap = new Map();
    for (const r of (local.rabArchives||[])) if(r?.id) rabMap.set(r.id, JSON.parse(JSON.stringify(r)));
    for (const r of (remote.rabArchives||[])) {
      if(r?.id) {
        const existing = rabMap.get(r.id);
        if(existing){
          r.items = mergeArray(existing.items, r.items);
        }
        rabMap.set(r.id, r);
      }
    }
    merged.rabArchives = Array.from(rabMap.values());
    merged.activeRabId = local.activeRabId || remote.activeRabId;
    merged.counters = {
      journal: Math.max(local.counters?.journal||0, remote.counters?.journal||0),
      payable: Math.max(local.counters?.payable||0, remote.counters?.payable||0),
      receivable: Math.max(local.counters?.receivable||0, remote.counters?.receivable||0),
      asset: Math.max(local.counters?.asset||0, remote.counters?.asset||0),
      payroll: Math.max(local.counters?.payroll||0, remote.counters?.payroll||0),
      statement: Math.max(local.counters?.statement||0, remote.counters?.statement||0),
    };
    return merged;
  }

  function load(){
    if(cache)return cache;
    try{const raw=localStorage.getItem(KEY);cache=raw?JSON.parse(raw):blank();}
    catch{cache=blank();}
    cache=migrate(cache);
    return cache;
  }

  function saveLocal(){
    try{localStorage.setItem(KEY,JSON.stringify(cache));}
    catch{throw new Error('Penyimpanan browser penuh.');}
  }

  async function saveRemote(){
    if(!API_CONFIG.enabled) return false;
    if(!isInTelegram()) return false;
    if(!remoteLoaded){
      console.warn('[STORE] Skip saveRemote — belum load dari server');
      pendingSyncAfterLoad = true;
      return false;
    }
    try{
      await API.saveState(cache);
      localStorage.setItem(SYNC_KEY, new Date().toISOString());
      return true;
    }catch(e){
      console.warn('[STORE] Save remote gagal:', e.message);
      ConnectionStatus.lastError = e.message;
      return false;
    }
  }

  function scheduleRemoteSync(){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(async ()=>{
      if(syncing) return;
      syncing=true;
      const ok=await saveRemote();
      syncing=false;
      if(ok){
        ConnectionStatus.online=true;
        ConnectionStatus.notify();
      }
      if(typeof updateSyncIndicator==='function') updateSyncIndicator();
    }, 2000);
  }

  function persist(){
    saveLocal();
    scheduleRemoteSync();
  }

  async function loadRemote(){
    if(!API_CONFIG.enabled) return false;
    if(!isInTelegram()) {
      console.log('[STORE] Bukan di Telegram, skip loadRemote');
      return false;
    }
    try{
      const res=await API.getState();
      const localState = load();
      
      if(res.state){
        const serverVersion = res.version || 0;
        const serverCount = countData(res.state);
        const localCount = countData(localState);
        
        console.log(`[STORE] Server: v${serverVersion}, ${serverCount} item`);
        console.log(`[STORE] Local: ${localCount} item`);
        
        if(localCount > 0 && localCount > serverCount){
          console.log('[STORE] Lokal lebih banyak, MERGE');
          cache = mergeStates(localState, res.state);
          saveLocal();
          remoteLoaded = true;
          try {
            await API.saveState(cache);
            console.log('[STORE] Merged state dikirim ke server');
          } catch(e) {
            console.warn('[STORE] Gagal kirim merged state:', e.message);
          }
        } else if(serverCount > 0){
          console.log('[STORE] Pakai state dari server');
          cache = migrate(res.state);
          saveLocal();
          remoteLoaded = true;
        } else if(localCount > 0){
          console.log('[STORE] Server kosong isi, upload dari lokal');
          cache = localState;
          remoteLoaded = true;
          try {
            await API.saveState(cache);
            console.log('[STORE] State lokal di-upload ke server');
          } catch(e) {
            console.warn('[STORE] Gagal upload:', e.message);
          }
        } else {
          console.log('[STORE] Kedua sisi kosong');
          remoteLoaded = true;
        }
        return true;
      } else {
        console.log('[STORE] Server kosong untuk user ini');
        remoteLoaded = true;
        const localCount = countData(localState);
        if(localCount > 0){
          try {
            await API.saveState(localState);
            console.log('[STORE] Initial upload ke server');
          } catch(e) {
            console.warn('[STORE] Gagal initial upload:', e.message);
          }
        }
        return false;
      }
    }catch(e){
      console.warn('[STORE] Load remote gagal:', e.message);
      ConnectionStatus.lastError = e.message;
      remoteLoaded = true;
    }
    return false;
  }

  return{
    get state(){return load();},
    commit(){persist();},
    reset(){cache=blank();seedCOA(cache);saveLocal();scheduleRemoteSync();},
    replace(next){cache=migrate(next);persist();},
    loadRemote,
    saveRemote,
    isRemoteLoaded(){return remoteLoaded;},
    getLastSync(){return localStorage.getItem(SYNC_KEY);},
  };
})();

function postClientReceipt(flow){const kas=Accounting.accByCode('1100'),pend=Accounting.accByCode('4100');return Accounting.createJournal({date:flow.date,description:`Penerimaan klien: ${flow.ref}`,reference:flow.id,lines:[{accountId:kas.id,debit:flow.amount,description:'Kas masuk'},{accountId:pend.id,credit:flow.amount,description:'Pendapatan klien'}],idempotencyKey:'flow-'+flow.id});}

function postReturn(flow){const kasPusat=Accounting.accByCode('1100'),kasDept=Accounting.accByCode('1110');return Accounting.createJournal({date:flow.date,description:`Pengembalian dari ${flow.dept}: ${flow.ref}`,reference:flow.id,lines:[{accountId:kasPusat.id,debit:flow.amount,description:'Kas pusat masuk'},{accountId:kasDept.id,credit:flow.amount,description:`Kas ${flow.dept} kembali`}],idempotencyKey:'flow-'+flow.id});}
function postExpense(exp){
  const lines=[];
  const activeRab=Store.state.rabArchives.find(r=>r.id===Store.state.activeRabId);
  const rabItem=activeRab?.items.find(i=>i.id===exp.rabItemId);
  let debitAcc;
  if(rabItem&&rabItem.akunCoa){debitAcc=Accounting.accByCode(String(rabItem.akunCoa));}
  if(!debitAcc){const kindToCode={'Beban':'5100','Persediaan':'1300','Aset':'1400'};debitAcc=Accounting.accByCode(kindToCode[exp.kind]||'5100');}
  const creditAcc=Accounting.accByCode('1110');
  if(!debitAcc||!creditAcc)throw new Error('Akun tidak ditemukan.');
  let pphAmount=0;
  const pajak=rabItem?.pajak||'Tanpa Pajak';
  if(pajak.startsWith('PPh 23'))pphAmount=Math.round(exp.amount*0.02);
  else if(pajak.startsWith('PPh 4(2)'))pphAmount=Math.round(exp.amount*0.10);
  const netAmount=exp.amount-pphAmount;
  lines.push({accountId:debitAcc.id,debit:exp.amount,description:exp.title});
  if(pphAmount>0){const hutPph=Accounting.accByCode(pajak.startsWith('PPh 4(2)')?'2240':'2230');lines.push({accountId:hutPph.id,credit:pphAmount,description:'Potongan '+pajak});}
  lines.push({accountId:creditAcc.id,credit:netAmount,description:`Kas ${exp.dept}`});
  return Accounting.createJournal({date:exp.date,description:`${exp.kind}: ${exp.title}${exp.vendor?' — '+exp.vendor:''}`,reference:exp.id,lines,idempotencyKey:'exp-'+exp.id});
}
function autoJournalizeAll(){

    if(e.status!=='Diverifikasi')continue;
    if(s.journals.some(j=>j.idempotencyKey==='exp-'+e.id))continue;
    try{postExpense(e);}catch(err){console.warn('Auto-journal exp gagal',e.id,err.message);}
  }
}

function save(action){
  try{autoJournalizeAll();}catch(e){notice('Auto-jurnal: '+e.message);}
  Store.state.audit.unshift({time:new Date().toISOString(),actor:role,action});
  try{Store.commit();}catch(e){notice(e.message);return;}
  render();
  setTimeout(updateSyncIndicator, 100);
}

function updateSyncIndicator(){
  const el=document.getElementById('sync-indicator');
  if(!el) return;
  const lastSync=Store.getLastSync();
  const online=ConnectionStatus.online;
  if(!isInTelegram()){
    el.textContent='● Mode lokal (bukan Telegram)';
    el.style.color='#886211';
    el.title='Buka dari Telegram untuk sinkronisasi cloud';
  } else if(!Store.isRemoteLoaded()){
    el.textContent='● Memuat data server...';
    el.style.color='#886211';
  } else if(online===true){
    el.textContent='● Tersinkron';
    el.style.color='#226846';
    el.title=lastSync ? 'Terakhir: '+new Date(lastSync).toLocaleString('id-ID') : '';
  } else if(online===false){
    el.textContent='● Offline (lokal)';
    el.style.color='#886211';
    el.title=ConnectionStatus.lastError || 'Tidak terhubung ke server';
  } else {
    el.textContent='● Memeriksa...';
    el.style.color='#718077';
  }
}

function mail(text){Store.state.mail.unshift({time:new Date().toISOString(),text});}
function available(d){return sum(Store.state.flows.filter(x=>x.dept===d),x=>x.type==='allocation'?x.amount:x.type==='return'?-x.amount:0)-sum(Store.state.expenses.filter(x=>x.dept===d),x=>x.amount);}
function center(){return sum(Store.state.flows,x=>x.type==='income'||x.type==='return'?x.amount:-x.amount);}

   TABLE BUILDER
   ============================================================ */
let _tableCounter=0;
function table(headers,rows,opts){
  const id='tbl-'+(++_tableCounter);
  const showButtons=opts!==false;
  const buttons=showButtons?`<div class="scroll-buttons noprint">
    <button type="button" onclick="scrollTable('${id}',-400)">← Geser Kiri</button>
    <button type="button" onclick="scrollTable('${id}',400)">Geser Kanan →</button>
    <button type="button" onclick="scrollTable('${id}',-99999)">⇤ Ke Awal</button>
    <button type="button" onclick="scrollTable('${id}',99999)">Ke Akhir ⇥</button>
    <button type="button" onclick="scrollTable('${id}','reset')">🔄 Reset</button>
    <span class="scroll-info">Klik tombol untuk navigasi horizontal</span>
  </div>`:'';
  return `<div class="table-block">${buttons}<div class="tablewrap" id="${id}"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div></div>`;
}
function scrollTable(id,delta){
  const el=document.getElementById(id);
  if(!el)return;
  if(delta==='reset'){el.scrollTo({left:0,behavior:'smooth'});return;}
  el.scrollBy({left:delta,behavior:'smooth'});
}

/* ============================================================
   FUNGSI SYNC MANUAL
   ============================================================ */
async function manualSync(){
  if(!isInTelegram()){
    return notice('Buka dari Telegram untuk sinkronisasi cloud');
  }
  if(!Store.isRemoteLoaded()){
    return notice('Tunggu data dari server selesai dimuat');
  }
  notice('Menyinkronkan...');
  const ok=await Store.saveRemote();
  if(ok){
    notice('Berhasil sinkron ke server');
    ConnectionStatus.online=true;
    ConnectionStatus.lastError=null;
  } else {
    notice('Gagal sinkron: '+(ConnectionStatus.lastError||'tidak diketahui'));
    ConnectionStatus.online=false;
  }
  ConnectionStatus.notify();
  render();
}

async function checkConnection(){
  if(!isInTelegram()){
    ConnectionStatus.online=false;
    ConnectionStatus.lastError='Tidak di Telegram (mode lokal)';
    notice('Buka dari Telegram untuk cek koneksi cloud');
    render();
    return;
  }
  notice('Memeriksa koneksi...');
  const online=await ConnectionStatus.check();
  if(online){
    notice('Koneksi OK');
  } else {
    notice('Offline: '+ConnectionStatus.lastError);
  }
  render();
}

async function showSyncLog(){
  if(!isInTelegram()){
    return notice('Buka dari Telegram untuk lihat log');
  }
  try{
    const res=await API.getSyncLog();
    const log=res.log || [];
    if(!log.length){
      return notice('Belum ada log sinkronisasi');
    }
    const rows=log.map((x,idx)=>`<tr>
      <td class="no">${idx+1}</td>
      <td>${esc(x.action)}</td>
      <td>${x.payload_size?Math.round(x.payload_size/1024*10)/10+' KB':'—'}</td>
      <td>${new Date(x.created_at+'Z').toLocaleString('id-ID')}</td>
    </tr>`).join('');
    $('modal').innerHTML=`<h2>Log Sinkronisasi</h2>${table(['No','Aksi','Ukuran','Waktu'],[rows],false)}<div class="row" style="margin-top:16px"><button class="secondary" onclick="$('modal').close()">Tutup</button></div>`;
    $('modal').showModal();
  }catch(e){
    notice('Gagal ambil log: '+e.message);
  }
}

function renderBankResult(){
  const statements=Store.state.bankStatements;
  if(!statements.length)return '<div class="panel"><p class="mini">Belum ada data.</p></div>';
  const totalRows=sum(statements,s=>s.rows.length);
  const matched=sum(statements,s=>s.rows.filter(r=>r.matched).length);
  const unmatched=totalRows-matched;
  const totalIn=sum(statements,s=>s.rows.filter(r=>r.amount>0).reduce((a,r)=>a+r.amount,0));
  const totalOut=sum(statements,s=>s.rows.filter(r=>r.amount<0).reduce((a,r)=>a+r.amount,0));
  return `<div class="cards">
      ${card('Total Baris',totalRows,`${statements.length} statement`)}
      ${card('Cocok',matched,`${totalRows?Math.round(matched/totalRows*100):0}% match rate`)}
      ${card('Tidak Cocok',unmatched,'Perlu investigasi')}
      ${card('Net Kas',totalIn+totalOut,`Masuk ${money(totalIn)}`)}
    </div>
    <div class="panel"><h2>Rekap per Statement</h2>${table(['No','File','Baris','Cocok','Tidak Cocok','Masuk','Keluar'],
      statements.map((s,idx)=>{
        const m=s.rows.filter(r=>r.matched).length;
        const tin=s.rows.filter(r=>r.amount>0).reduce((a,r)=>a+r.amount,0);
        const tout=s.rows.filter(r=>r.amount<0).reduce((a,r)=>a+r.amount,0);
        return `<tr><td class="no">${idx+1}</td><td>${esc(s.fileName)}</td><td>${s.rows.length}</td><td>${m}</td><td>${s.rows.length-m}</td><td class="num">${money(tin)}</td><td class="num">${money(tout)}</td></tr>`;
      }))}</div>`;
}

function parseRabCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw Error('File kosong.');
  const sep=lines[0].includes('\t')?'\t':(lines[0].includes(';')?';':',');
  const header=lines[0].split(sep).map(h=>h.trim().toLowerCase());
  const idx={
    scene:header.findIndex(h=>/adegan|scene|^set/.test(h)),location:header.findIndex(h=>/lokasi|location|atmosfer/.test(h)),
    item:header.findIndex(h=>/deskripsi|item/.test(h)),dept:header.findIndex(h=>/departemen|dept/.test(h)),
    target:header.findIndex(h=>/target/.test(h)),sumber:header.findIndex(h=>/sumber/.test(h)),
    vendor:header.findIndex(h=>/vendor/.test(h)),akunCoa:header.findIndex(h=>/akun|coa/.test(h)),
    klasifikasi:header.findIndex(h=>/klasifikasi|classification/.test(h)),pajak:header.findIndex(h=>/pajak|tax/.test(h)),
    termin:header.findIndex(h=>/termin/.test(h)),kapitalisasi:header.findIndex(h=>/kapitalisasi/.test(h)),
    price:header.findIndex(h=>/harga|price/.test(h)),qty:header.findIndex(h=>/qty|quantity/.test(h)),
    total:header.findIndex(h=>/^total/.test(h)),notes:header.findIndex(h=>/catatan|notes/.test(h))
  };
  if(idx.item<0||idx.price<0||idx.qty<0)throw Error('Kolom wajib tidak ditemukan.');
  const items=[];
  for(let i=1;i<lines.length;i++){
    const cells=parseDelimitedLine(lines[i],sep);
    const get=k=>idx[k]>=0?(cells[idx[k]]||'').trim():'';
    const item=get('item');if(!item)continue;
    if(/reuse/i.test(get('notes'))||/sudah terhitung/i.test(get('notes')))continue;
    const price=parseFloat(get('price').replace(/[^\d.-]/g,''))||0;
    const qty=parseFloat(get('qty').replace(/[^\d.-]/g,''))||0;
    const srcTotal=parseFloat(get('total').replace(/[^\d.-]/g,''))||0;
    if(price<=0||qty<=0)continue;
    const deptVal=get('dept')||'Props';
    const sumber=get('sumber')||'Workshop';
    const akun=String(parseInt(get('akunCoa'))||defaultAkun(deptVal,sumber));
    const klasifikasi=get('klasifikasi')||defaultKlasifikasi(sumber,price);
    const pajak=get('pajak')||defaultPajak(sumber,item);
    items.push({id:uid(),scene:get('scene'),set:get('scene'),location:get('location'),item,dept:deptVal,target:get('target'),sumber,vendor:get('vendor'),akunCoa:akun,klasifikasi,pajak,termin:get('termin')||'Lunas',kapitalisasi:get('kapitalisasi')||'Tidak',price,qty,unit:'',total:srcTotal||Math.round(price*qty),notes:get('notes'),status:'Draft'});
  }
  return items;
}
function parseDelimitedLine(line,sep){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===sep&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}
function defaultAkun(deptVal,sumber){return AKUN_COA_MAP[deptVal]||'5100';}
function defaultKlasifikasi(sumber,price){if(sumber==='Beli'&&price>=1000000)return 'Aset';return 'Beban';}
function defaultPajak(sumber,item){if(sumber==='On-site'||sumber==='Beli')return 'Tanpa Pajak';if(sumber==='Sewa'&&/bangunan|tanah|rumah|ruko/i.test(item))return 'PPh 4(2) (10%)';return 'PPh 23 (2%)';}

async function importRabFile(file){
  if(!file)return;
  try{
    let items=[];
    if(/\.csv$/i.test(file.name)){const text=await file.text();items=parseRabCSV(text);}
    else if(/\.xlsx$/i.test(file.name)){items=await parseRabXlsx(file);}
    else throw Error('Format harus .xlsx atau .csv');
    if(!items.length)throw Error('Tidak ada baris RAB berbiaya yang bisa diimpor.');
    const versionName=file.name.replace(/\.(xlsx|csv)$/i,'').trim();
    const existingArchive=Store.state.rabArchives.find(r=>r.name===versionName);
    let msg=`RAB "${versionName}" berisi ${items.length} item dengan total ${money(sum(items,total))}.`;
    if(existingArchive)msg+=`\n\nSudah ada RAB dengan nama sama. Akan digantikan.`;
    msg+='\n\nTambahkan ke arsip dan aktifkan?';
    if(!confirm(msg))return;
    if(existingArchive){const idx=Store.state.rabArchives.findIndex(r=>r.name===versionName);Store.state.rabArchives.splice(idx,1);}
    const rab={id:uid(),name:versionName,uploadedAt:new Date().toISOString(),items:items.map(it=>({...it,status:'Draft'}))};
    Store.state.rabArchives.push(rab);
    Store.state.activeRabId=rab.id;
    save(`Upload RAB: ${versionName} (${items.length} item)`);
    notice(`RAB ${versionName} diaktifkan.`);
  }catch(e){notice(e.message||'File gagal dibaca.');}
}
async function parseRabXlsx(file){
  const files=await unzipXlsx(file);
  const workbook=files.get('xl/workbook.xml'),relations=files.get('xl/_rels/workbook.xml.rels');
  if(!workbook||!relations)throw Error('Workbook Excel tidak terbaca.');
  const relMap={};for(const m of relations.matchAll(/<Relationship\b([^>]*)\/?\s*>/g)){const a=xmlAttrs(m[1]);relMap[a.Id]=a.Target;}
  const shared=[];const sharedXml=files.get('xl/sharedStrings.xml');
  if(sharedXml)for(const m of sharedXml.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g))shared.push(textTags(m[1]));
  let targetSheet=null;
  for(const m of workbook.matchAll(/<sheet\b([^>]*)\/?\s*>/g)){
    const a=xmlAttrs(m[1]);const key=String(a.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(key==='sheet1'||key.includes('rab')||!targetSheet)targetSheet=a;
  }
  if(!targetSheet)throw Error('Sheet tidak ditemukan.');
  const rel=relMap[targetSheet['r:id']];if(!rel)throw Error('Relasi sheet tidak ditemukan.');
  const path=rel.startsWith('/')?rel.slice(1):('xl/'+rel).split('/').reduce((arr,x)=>{if(x==='..')arr.pop();else if(x!=='.')arr.push(x);return arr;},[]).join('/');
  const xml=files.get(path);if(!xml)throw Error('Sheet XML tidak ditemukan.');
  const rows=xlsxRows(xml,shared);
  let headerIdx=-1,cols={};
  for(let i=0;i<rows.length;i++){
    const c=rows[i].cells;const vals=Object.values(c).map(v=>String(v||'').toLowerCase());
    if(vals.some(v=>/adegan/.test(v))||vals.some(v=>/deskripsi/.test(v))){headerIdx=i;break;}
  }
  if(headerIdx<0)throw Error('Baris header tidak ditemukan.');
  const hc=rows[headerIdx].cells;
  for(const [i,v] of Object.entries(hc)){
    const h=String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(h==='adeganset')cols.scene=Number(i);else if(h==='lokasiatmosfer')cols.location=Number(i);
    else if(h==='deskripsiitem')cols.item=Number(i);else if(h==='departemen')cols.dept=Number(i);
    else if(h==='target')cols.target=Number(i);else if(h==='sumber')cols.sumber=Number(i);
    else if(h==='vendor')cols.vendor=Number(i);else if(h==='akuncoa')cols.akunCoa=Number(i);
    else if(h==='klasifikasi')cols.klasifikasi=Number(i);else if(h==='pajak')cols.pajak=Number(i);
    else if(h==='termin')cols.termin=Number(i);else if(h==='kapitalisasi')cols.kapitalisasi=Number(i);
    else if(h==='hargasatuan')cols.price=Number(i);else if(h==='qty')cols.qty=Number(i);
    else if(h==='total')cols.total=Number(i);else if(h==='catatansumber')cols.notes=Number(i);
  }
  if(cols.item===undefined||cols.price===undefined||cols.qty===undefined)throw Error('Kolom wajib tidak ditemukan.');
  const items=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const c=rows[i].cells;const get=k=>cols[k]!==undefined?(c[cols[k]]??''):'';
    const item=String(get('item')||'').trim();if(!item)continue;
    const notes=String(get('notes')||'').trim();
    if(/reuse/i.test(notes)||/sudah terhitung/i.test(notes))continue;
    const price=parseFloat(String(get('price')).replace(/[^\d.-]/g,''))||0;
    const qty=parseFloat(String(get('qty')).replace(/[^\d.-]/g,''))||0;
    if(price<=0||qty<=0)continue;
    const deptVal=String(get('dept')||'Props').trim();
    const sumber=String(get('sumber')||'Workshop').trim();
    const akun=String(parseInt(get('akunCoa'))||defaultAkun(deptVal,sumber));
    const klasifikasi=String(get('klasifikasi')||defaultKlasifikasi(sumber,price)).trim();
    const pajak=String(get('pajak')||defaultPajak(sumber,item)).trim();
    items.push({id:uid(),scene:String(get('scene')||'').trim(),set:String(get('scene')||'').trim(),location:String(get('location')||'').trim(),item,dept:deptVal,target:String(get('target')||'').trim(),sumber,vendor:String(get('vendor')||'').trim(),akunCoa:akun,klasifikasi,pajak,termin:String(get('termin')||'Lunas').trim(),kapitalisasi:String(get('kapitalisasi')||'Tidak').trim(),price,qty,unit:'',total:Math.round(price*qty),notes,status:'Draft'});
  }
  return items;
}
function xmlDecode(s){return String(s||'').replace(/&#x([\da-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');}
function xmlAttrs(s){const a={};for(const m of String(s||'').matchAll(/([\w:.-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g))a[m[1]]=xmlDecode(m[2]??m[3]);return a;}
function colIndex(ref){let n=0;for(const c of String(ref||'').match(/^[A-Z]+/i)?.[0]?.toUpperCase()||'')n=n*26+c.charCodeAt(0)-64;return n;}
function textTags(xml){return [...String(xml||'').matchAll(/<(?:[\w.-]+:)?t\b[^>]*>([\s\S]*?)<\/(?:[\w.-]+:)?t\s*>/g)].map(m=>xmlDecode(m[1].replace(/<[^>]+>/g,''))).join('');}
async function unzipXlsx(file){
  if(file.size>20*1024*1024)throw Error('File terlalu besar (maks 20 MB).');
  const buffer=await file.arrayBuffer(),view=new DataView(buffer),bytes=new Uint8Array(buffer);
  let end=-1;
  for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(view.getUint32(i,true)===0x06054b50){end=i;break;}
  if(end<0)throw Error('Bukan .xlsx valid.');
  const count=view.getUint16(end+10,true),dirOffset=view.getUint32(end+16,true);
  const files=new Map();let p=dirOffset,totalInflated=0;
  for(let i=0;i<count;i++){
    const flags=view.getUint16(p+8,true),method=view.getUint16(p+10,true),compressed=view.getUint32(p+20,true),uncompressed=view.getUint32(p+24,true),nameLen=view.getUint16(p+28,true),extraLen=view.getUint16(p+30,true),commentLen=view.getUint16(p+32,true),local=view.getUint32(p+42,true),name=new TextDecoder().decode(bytes.slice(p+46,p+46+nameLen));
    p+=46+nameLen+extraLen+commentLen;
    if(!/\.(xml|rels)$/i.test(name))continue;
    if(flags&1)throw Error('Excel terenkripsi.');
    totalInflated+=uncompressed;
    if(totalInflated>50*1024*1024)throw Error('Isi Excel terlalu besar.');
    const start=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true),payload=bytes.slice(start,start+compressed);
    let raw;
    if(method===0)raw=payload;
    else if(method===8){if(typeof DecompressionStream==='undefined')throw Error('Browser belum mendukung.');raw=new Uint8Array(await new Response(new Blob([payload]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}
    else throw Error('Kompresi tidak didukung.');
    files.set(name,new TextDecoder().decode(raw));
  }
  return files;
}
function xlsxRows(xml,shared){
  const rows=[];
  for(const row of String(xml||'').matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)){
    const cells={};
    for(const cell of row[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const a=xmlAttrs(cell[1]),body=cell[2]||'',ref=a.r||'';
      const v=body.match(/<(?:[\w.-]+:)?v\b[^>]*>([\s\S]*?)<\/(?:[\w.-]+:)?v\s*>/);
      const col=colIndex(ref);if(!col)continue;
      let value=v?xmlDecode(v[1]):'';
      if(a.t==='s'&&value!=='')value=shared[Number(value)]??'';
      else if(a.t==='inlineStr')value=textTags(body);
      else if(a.t==='b')value=value==='1';
      else if(value!==''&&a.t!=='str'&&!Number.isNaN(Number(value)))value=Number(value);
      cells[col]=value;
    }
    if(Object.keys(cells).length)rows.push({cells});
  }
  return rows;
}

function requestStatus(id,status){
  if(!all())return notice('Hanya Manager Finance atau Direktur.');

  x.status=status;mail(`Pengajuan “${x.title}” ${status.toLowerCase()}.`);save(`Pengajuan ${x.title}: ${status}`);
}
function flowForm(requestId){
  if(!all())return notice('Hanya Manager Finance atau Direktur.');
  const req=requestId?Store.state.requests.find(x=>x.id===requestId):null;
  if(requestId&&(!req||req.status!=='Disetujui'))return notice('Pengajuan belum disetujui.');
  const paid=req?sum(Store.state.flows.filter(x=>x.requestId===req.id&&x.type==='allocation'),x=>x.amount):0;
  const remaining=req?req.amount-paid:null;
  if(req&&remaining<=0)return notice('Pengajuan sudah dicairkan penuh.');
  const types=req?['Pencairan departemen']:['Dana dari klien','Pencairan departemen','Pengembalian sisa'];
  const dOpts=req?[req.dept]:['Pusat',...DEPTS];
  openForm(req?'Catat pencairan pengajuan':'Catat kas masuk / pencairan',
    pick('Jenis transaksi','flowType',types,types[0])
    +pick('Tujuan / departemen','flowDept',dOpts,req?req.dept:'Pusat')
    +field('Tanggal','date',today(),'date','required')
    +field('Referensi / sumber','ref',req?req.title:'','text','required maxlength="180"')
    +field('Nominal (Rp)','amount',req?remaining:'','number',`required min="1" ${req?`max="${remaining}"`:''} step="1"`),
    v=>{
      const labels={'Dana dari klien':'income','Pencairan departemen':'allocation','Pengembalian sisa':'return'};
      const type=labels[v.flowType];const d=v.flowDept==='Pusat'?'':v.flowDept;const amount=validAmount(v.amount);
      if(type==='allocation'&&amount>center())throw Error('Saldo kas pusat tidak cukup.');
      if(type==='return'&&amount>available(d))throw Error('Pengembalian melebihi sisa dana departemen.');
      if(req&&(amount>remaining||d!==req.dept))throw Error('Pencairan melebihi sisa pengajuan.');
      const x={id:uid(),type,dept:d,date:v.date,ref:v.ref.trim(),amount,status:'Tercatat',requestId:req?.id||''};
      Store.state.flows.push(x);
      mail(type==='income'?`Penerimaan klien: ${money(amount)}.`:`${type==='allocation'?'Pencairan':'Pengembalian'} ${d}: ${money(amount)}.`);
      save(`Catat ${type}: ${money(amount)}`);
    });
}

  const rabItems=activeRab?activeRab.items.filter(i=>['Diajukan','Disetujui'].includes(i.status)):[];

    +field('Tanggal','date',x?.date||today(),'date','required')
    +field('Uraian pembelian','title',x?.title||'','text','required maxlength="180"')
    +field('Vendor / penerima','vendor',x?.vendor||'','text','maxlength="160"')
    +`<label>Item RAB (opsional)<select name="rabItemId"><option value="">— Tidak terkait RAB —</option>${rabItems.map(i=>`<option value="${i.id}" ${x?.rabItemId===i.id?'selected':''}>${esc(i.item.slice(0,60))} — ${money(total(i))}</option>`).join('')}</select></label>`
    +pick('Klasifikasi','kind',['Beban','Persediaan','Aset'],x?.kind||'Beban')
    +field('Nominal (Rp)','amount',x?.amount||'','number','required min="1" step="1"')
    +`<label class="full">Bon / bukti (opsional)<input name="receiptFile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" style="display:block;width:100%;margin-top:6px">${x?.receipt?'<small>Bukti lama dipertahankan jika tidak pilih file baru.</small>':''}</label>`;
  openForm(id?'Edit pengeluaran':'Catat pengeluaran',fields,async v=>{
    const amount=validAmount(v.amount);
    const file=v.receiptFile;
    if(file&&file.size>1024*1024)throw Error('Ukuran bukti maksimal 1 MB.');
    let receipt=x?.receipt||'';
    if(file&&file.size){
      if(!['application/pdf','image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Format bukti harus PDF/JPG/PNG/WEBP.');
      receipt=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Bukti tidak dapat dibaca.'));reader.readAsDataURL(file);});
    }
    const item={id:x?.id||uid(),date:v.date,dept:v.dept,title:v.title.trim(),vendor:v.vendor.trim(),kind:v.kind,amount,receipt,rabItemId:v.rabItemId||'',status:x?.status||'Menunggu verifikasi'};
    if(x)Object.assign(x,item);else Store.state.expenses.push(item);
    mail(`Pengeluaran ${item.dept}: ${item.title} sebesar ${money(item.amount)}.`);
    save(`${x?'Memperbarui':'Mencatat'} pengeluaran ${item.title}`);
  });
}
function removeExpense(id){
  const i=Store.state.expenses.findIndex(x=>x.id===id);
  if(i<0||Store.state.expenses[i].status==='Diverifikasi')return notice('Pengeluaran terverifikasi tidak dapat dihapus.');
  if(!all()&&Store.state.expenses[i].dept!==dept())return notice('Anda hanya dapat mengelola departemen sendiri.');
  if(!confirm('Hapus laporan ini?'))return;
  const [x]=Store.state.expenses.splice(i,1);save(`Menghapus pengeluaran ${x.title}`);
}
function verifyExpense(id){
  if(!all())return;
  const x=Store.state.expenses.find(x=>x.id===id);
  if(!x||x.status==='Diverifikasi')return;
  x.status='Diverifikasi';
  mail(`Pengeluaran ${x.title} (${money(x.amount)}) diverifikasi.`);
  save('Verifikasi pengeluaran: '+x.title);
}
function receipt(id){
  const x=Store.state.expenses.find(x=>x.id===id);
  if(!x?.receipt)return notice('Bukti tidak tersedia.');
  const match=/^data:(application\/pdf|image\/(?:jpeg|png|webp));base64,([A-Za-z0-9+/=]+)$/.exec(x.receipt);
  if(!match)return notice('Format bukti tidak valid.');
  const raw=atob(match[2]),bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([bytes],{type:match[1]}));
  const win=window.open(url,'_blank','noopener');
  if(!win)notice('Izinkan jendela baru.');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ============================================================
   REKONSILIASI BANK
   ============================================================ */
async function uploadBankStatement(file){
  if(!file)return;
  try{
    const text=await file.text();
    const rows=parseBankCSV(text);
    if(!rows.length)throw Error('Tidak ada baris valid.');
    const st={id:uid(),fileName:file.name,uploadedAt:new Date().toISOString(),rows:rows.map(r=>({...r,matched:false,matchedJournalId:null}))};
    Store.state.bankStatements.push(st);
    save(`Upload statement: ${file.name} (${rows.length} baris)`);
  }catch(e){notice(e.message);}
}
function parseBankCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw Error('CSV terlalu pendek.');
  const sep=lines[0].includes(';')?';':',';
  const header=lines[0].split(sep).map(h=>h.trim().toLowerCase());
  const dateIdx=header.findIndex(h=>/tanggal|date/.test(h));
  const descIdx=header.findIndex(h=>/keterangan|deskripsi|description|note|remark/.test(h));
  const amtIdx=header.findIndex(h=>/nominal|amount|jumlah|mutasi/.test(h));
  if(dateIdx<0||descIdx<0||amtIdx<0)throw Error('Kolom wajib: Tanggal, Keterangan, Nominal.');
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cells=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
    const dateRaw=cells[dateIdx],desc=cells[descIdx]||'',amtRaw=cells[amtIdx];
    if(!dateRaw||!amtRaw)continue;
    const date=normalizeDate(dateRaw);if(!date)continue;
    const amount=parseAmount(amtRaw);if(amount===null)continue;
    rows.push({date,description:desc,amount});
  }
  return rows;
}
function normalizeDate(s){
  if(!s)return null;s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m){const d=String(m[1]).padStart(2,'0'),mo=String(m[2]).padStart(2,'0');return `${m[3]}-${mo}-${d}`;}
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
  if(m){const d=String(m[1]).padStart(2,'0'),mo=String(m[2]).padStart(2,'0');return `20${m[3]}-${mo}-${d}`;}
  return null;
}
function parseAmount(s){
  if(s===null||s===undefined)return null;
  let str=String(s).trim();if(!str)return null;
  const isParen=str.startsWith('(')&&str.endsWith(')');
  str=str.replace(/[()]/g,'').replace(/rp/gi,'').replace(/\s/g,'').replace(/[^\d,.-]/g,'');
  const dot=str.lastIndexOf('.'),comma=str.lastIndexOf(',');
  if(dot>=0&&comma>=0){if(comma>dot)str=str.replace(/\./g,'').replace(',','.');else str=str.replace(/,/g,'');}
  else if(comma>=0){const dec=str.length-comma-1;str=dec>0&&dec<=2?str.replace(',','.'):str.replace(/,/g,'');}
  else if((str.match(/\./g)||[]).length>1){str=str.replace(/\./g,'');}
  else if(dot>=0&&str.length-dot-1===3){str=str.replace('.','');}
  const n=Number(str);if(!Number.isFinite(n))return null;
  return isParen?-Math.abs(n):n;
}
function runAutoMatch(stId){
  const st=Store.state.bankStatements.find(s=>s.id===stId);if(!st)return;
  let matched=0;
  for(const row of st.rows){
    if(row.matched)continue;
    const cand=findMatchingJournal(row);
    if(cand){row.matched=true;row.matchedJournalId=cand.id;matched++;}
  }
  save(`Auto-match: ${matched} cocok`);
  notice(`Auto-match: ${matched} dari ${st.rows.length} cocok.`);
}
function findMatchingJournal(row){
  const journals=Store.state.journals;
  const cashIds=Store.state.accounts.filter(a=>/^11\d\d/.test(a.code)).map(a=>a.id);
  for(const j of journals){
    if(j.status!=='posted')continue;
    const diff=Math.abs(daysBetween(j.date,row.date));
    if(diff>3)continue;
    let cashDelta=0;
    for(const l of j.lines){if(cashIds.includes(l.accountId))cashDelta+=l.debit-l.credit;}
    if(cashDelta===0)continue;
    if(Math.abs(cashDelta-row.amount)<=1)return j;
  }
  return null;
}
function daysBetween(d1,d2){const a=new Date(d1+'T00:00:00').getTime();const b=new Date(d2+'T00:00:00').getTime();return (a-b)/86400000;}
function manualMatch(stId,idx){
  const st=Store.state.bankStatements.find(s=>s.id===stId);if(!st)return;
  const row=st.rows[idx];
  const journals=Store.state.journals.filter(j=>j.status==='posted').slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,50);
  const opts_=journals.map(j=>{const cashDelta=j.lines.reduce((s,l)=>{const acc=Accounting.accById(l.accountId);return acc&&/^11\d\d/.test(acc.code)?s+(l.debit-l.credit):s;},0);return `<option value="${j.id}">${esc(j.date)} · ${esc(j.number)} · ${esc(j.description.slice(0,40))} · ${money(cashDelta)}</option>`;}).join('');
  $('modal').innerHTML=`<h2>Cocokkan Manual</h2><p>Statement: ${fmtDate(row.date)} · ${esc(row.description)} · ${money(row.amount)}</p><form id="form"><label>Pilih Jurnal<select name="jid">${opts_}</select></label><div class="row" style="margin-top:16px"><button type="submit">Cocokkan</button><button type="button" class="secondary" onclick="$('modal').close()">Batal</button></div></form>`;
  $('form').onsubmit=e=>{e.preventDefault();const jid=new FormData(e.target).get('jid');row.matched=true;row.matchedJournalId=jid;save('Manual match');$('modal').close();};
  $('modal').showModal();
}
function unmatch(stId,idx){const st=Store.state.bankStatements.find(s=>s.id===stId);if(!st)return;st.rows[idx].matched=false;st.rows[idx].matchedJournalId=null;save('Batal match');}
function viewStatement(id){
  const st=Store.state.bankStatements.find(s=>s.id===id);if(!st)return;
  $('modal').innerHTML=`<h2>${esc(st.fileName)}</h2><p>${st.rows.length} baris · ${new Date(st.uploadedAt).toLocaleString('id-ID')}</p>${table(['No','Tanggal','Keterangan','Nominal','Status'],st.rows.map((r,i)=>`<tr><td class="no">${i+1}</td><td>${fmtDate(r.date)}</td><td>${esc(r.description)}</td><td class="num">${money(r.amount)}</td><td>${r.matched?tag('Cocok'):tag('Tidak Cocok')}</td></tr>`),false)}<div class="row" style="margin-top:16px"><button class="secondary" onclick="$('modal').close()">Tutup</button></div>`;

async function restore(file){
  if(!file)return;
  try{
    const x=JSON.parse(await file.text());
    if(!x.accounts||!Array.isArray(x.accounts))throw Error('Cadangan tidak berisi accounts.');
    if(!x.journals||!Array.isArray(x.journals))throw Error('Cadangan tidak berisi journals.');
    if(!confirm('Pulihkan cadangan dan ganti data lokal?'))return;
    Store.replace(x);render();notice('Cadangan dipulihkan');
  }catch(e){notice(e.message);}
}
